# flix.nhant.com -> container homeflix:6969 (network app-net)
# Installed to /opt/nginx-proxy/nginx/conf.d/flix.conf by deploy/setup.sh
# Requires /opt/nginx-proxy/nginx/conf.d/00-global.conf (defines the $connection_upgrade map)
# - see initital-claude docs/specs/02-ingress-ssl.md
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flix.nhant.com;

    ssl_certificate     /etc/letsencrypt/live/flix.nhant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flix.nhant.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100m;

    location / {
        # Docker DNS: nginx stays up while homeflix is rebuilding
        resolver 127.0.0.11 valid=10s;
        set $upstream http://homeflix:6969;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Video streaming + cast SSE: no buffering, long timeouts
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
