        function updateDownloadIndicatorsUI() {
            document.querySelectorAll('.ep-dl-indicator').forEach(indicator => {
                const movieSlug = indicator.getAttribute('data-movie-slug');
                const epName = indicator.getAttribute('data-ep-name');
                if (!movieSlug || !epName) return;
                
                let status = "not_started";
                if (downloadStatuses[movieSlug] && downloadStatuses[movieSlug][epName]) {
                    status = downloadStatuses[movieSlug][epName];
                }
                
                indicator.className = `ep-dl-indicator ${status}`;
                
                if (status === 'completed') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    `;
                    indicator.title = "Đã tải xuống (Xem offline)";
                } else if (status === 'downloading') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 14 14">
                            <circle cx="7" cy="7" r="5" stroke-opacity="0.25"/>
                            <path d="M7 2a5 5 0 0 1 5 5" stroke-linecap="round"/>
                        </svg>
                    `;
                    indicator.title = "Đang tải...";
                } else if (status === 'pending') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 14 14">
                            <circle cx="7" cy="7" r="5"/>
                            <path stroke-linecap="round" d="M7 4v3l2 1"/>
                        </svg>
                    `;
                    indicator.title = "Đang chờ tải...";
                } else if (status === 'failed') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    `;
                    indicator.title = "Tải thất bại. Nhấp để tải lại.";
                } else {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                        </svg>
                    `;
                    indicator.title = "Tải trước tập này (MP4)";
                }
            });
        }

        async function requestDownloadEpisode(event, movieSlug, epName, epUrl) {
            if (event) event.stopPropagation();
            
            if (downloadStatuses[movieSlug] && (downloadStatuses[movieSlug][epName] === 'completed' || downloadStatuses[movieSlug][epName] === 'downloading' || downloadStatuses[movieSlug][epName] === 'pending')) {
                return;
            }
            
            if (!downloadStatuses[movieSlug]) downloadStatuses[movieSlug] = {};
            downloadStatuses[movieSlug][epName] = 'pending';
            updateDownloadIndicatorsUI();
            
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_slug: movieSlug, episode_name: epName, episode_url: epUrl })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    fetchDownloadStatuses();
                } else {
                    downloadStatuses[movieSlug][epName] = 'failed';
                    updateDownloadIndicatorsUI();
                }
            } catch (e) {
                console.error("Lỗi khi tải tập phim:", e);
                downloadStatuses[movieSlug][epName] = 'failed';
                updateDownloadIndicatorsUI();
            }
        }

        // --- 1. DYNAMIC DEVICE DETECTION ---
        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const body = document.body;
            
            const isTV = /tv|smarttv|googletv|appletv|hbbtv|netcast|webos|tizen|rokutv|ctv|box|playstation|xbox|nintendo|large-screen/i.test(ua)
                         || (window.screen.width >= 1920 && !('ontouchstart' in window));
            
            const isMobile = /iphone|ipad|ipod|android/i.test(ua)

        function execute(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const episodes = [];
            const regex = /(https?:\/\/[^\s|]+\.m3u8[^\s|]*)/i;

            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const url = match[0];
                    let title = line.includes('|') ? line.split('|')[0].trim() : "";
                    if (!title) {
                        const clean = line.replace(url, '').replace('|', '').trim();
                        title = clean || `Tập ${String(episodes.length + 1).padStart(2, '0')}`;
                    }
                    episodes.push({ name: title, link_m3u8: url });
                }
            });

            if (episodes.length > 0) {
                playEpisodesListDirect(episodes, episodes[0].link_m3u8);
            } else {
                alert('KHÔNG TÌM THẤY VIDEO');
            }
        }

        // Tải tập phim với tuỳ chọn vị trí phát bằng mảng tập phim đã chuẩn hóa
        function playEpisodesListDirect(episodesArray, targetUrlOrIdx) {
            if (!episodesArray || episodesArray.length === 0) {
                alert('KHÔNG TÌM THẤY VIDEO');
                return;
            }
            
            playbackEpisodes = episodesArray;
            
            if (stickyHeader) stickyHeader.style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');

            document.body.classList.add('player-active');
            globalPlayer.style.display = 'flex';
            
            // Add episodes drawer after player-wrapper
            const drawer = buildEpisodesDrawer();
            globalPlayer.appendChild(drawer);
            
            let playIdx = 0;
            episodesArray.forEach((ep, i) => {
                if (typeof targetUrlOrIdx === 'number') {
                    if (i === targetUrlOrIdx) playIdx = i;
                } else if (targetUrlOrIdx) {
                    if (ep.link_m3u8 === targetUrlOrIdx) playIdx = i;
                }
            });
            
            buildEpisodesGridInDrawer(episodesArray, playIdx);
            const startEp = episodesArray[playIdx];
            play(startEp.link_m3u8, startEp.name, playIdx);
            updateDownloadIndicatorsUI();
        }

        async function play(url, title, idx) {
            console.log("[Play] Bắt đầu phát tập:", title, "URL:", url, "currentMovie:", currentMovie);
            currentPlaybackIndex = idx;
            HFPlayerAuto.onEpisodeStart();
            syncDrawerToPlaying(url);

            // Vị trí xem dở của thiết bị này (đọc trước khi POST tiến độ làm đổi last_watched_url)
            positionTrackReady = false;
            clearResumeHandler();
            let resumeAt = 0;
            if (currentMovie && currentMovie.slug) {
                const saved = savedMoviesList.find(i => i.slug === currentMovie.slug);
                if (saved && saved.last_watched_url === url && saved.position > 5
                        && saved.duration && saved.position < saved.duration - 30) {
                    resumeAt = saved.position;
                }
            }
            if (castStartAt !== null) {
                resumeAt = castStartAt;
                castStartAt = null;
            }

            // Gửi báo cáo tiến trình xem phim về Server (nếu phim đã được lưu)
            if (currentMovie && currentMovie.slug) {
                console.log("[Play] Gửi tiến trình xem cho:", currentMovie.slug);
                fetch('/api/saved/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slug: currentMovie.slug,
                        last_watched_episode: title,
                        last_watched_url: url,
                        // Thông tin để server tạo hàng lịch sử cho phim chưa lưu
                        name: currentMovie.name,
                        poster_url: currentMovie.poster_url,
                        year: currentMovie.year,
                        episodes: playbackEpisodes
                    })
                }).then(res => res.json()).then(data => {
                    console.log("[Play] Lưu tiến trình xem thành công:", data);
                    if (data.status === 'success') {
                        const sIdx = savedMoviesList.findIndex(item => item.slug === currentMovie.slug);
                        if (sIdx > -1) {
                            savedMoviesList[sIdx].last_watched_episode = title;
                            savedMoviesList[sIdx].last_watched_url = url;
                            if (data.movie) {
                                savedMoviesList[sIdx].position = data.movie.position;
                                savedMoviesList[sIdx].duration = data.movie.duration;
                            }
                            // Cập nhật state trực tiếp để render màu sắc động tức thời
                            if (!savedMoviesList[sIdx].episode_states) {
                                savedMoviesList[sIdx].episode_states = {};
                            }
                            for (let key in savedMoviesList[sIdx].episode_states) {
                                if (savedMoviesList[sIdx].episode_states[key] === "watching") {
                                    savedMoviesList[sIdx].episode_states[key] = "watched";
                                }
                            }
                            savedMoviesList[sIdx].episode_states[url] = "watching";
                            refreshDetailEpisodeList();
                        } else if (data.movie) {
                            savedMoviesList.push(data.movie);
                            refreshDetailEpisodeList();
                        }
                    }
                }).catch(err => console.error("Error saving progress:", err));
            }

            if (hlsObj) {
                console.log("[Play] Hủy hlsObj cũ");
                hlsObj.destroy();
                hlsObj = null;
            }

            // Tập đã tải về đĩa MP4 chưa? Đọc từ trạng thái đã poll sẵn: không await mạng ở đây,
            // để việc gắn nguồn và phát chạy ngay trong cú chạm (iOS cần thao tác người dùng).
            let useMp4 = false;
            let mp4Url = "";
            const dl = currentMovie && currentMovie.slug ? downloadStatuses[currentMovie.slug] : null;
            if (dl && dl[title] === "completed") {
                useMp4 = true;
                mp4Url = `/media/${currentMovie.slug}/${encodeURIComponent(title)}.mp4`;
            }

            hidePlayerError();
            const store = safeStorage();
            let source = useMp4 ? mp4Url : HFPlayerUtils.streamSource(store, url, Date.now());
            // Proxy không lấy được nguồn (CDN chặn IP máy chủ): phát thẳng link gốc từ thiết bị này
            const fallbackDirect = () => {
                if (!HFPlayerUtils.isProxied(source)) return false;
                console.warn("[Play] Proxy lỗi, chuyển sang phát thẳng:", url);
                HFPlayerUtils.rememberDirect(store, Date.now());
                source = url;
                attachSource(source);
                return true;
            };

            video.onerror = () => {
                const code = video.error ? video.error.code : 4;
                console.error("[Play] Video Error Event:", video.error, "code:", code);
                if ((code === 2 || code === 4) && fallbackDirect()) return;
                showPlayerError(code === 3 ? "Không giải mã được tập này." : "Không phát được tập này.");
            };

            console.log("[Play] useMp4 =", useMp4, "mp4Url =", mp4Url);

            if (resumeAt > 0) {
                resumeHandler = () => {
                    video.currentTime = resumeAt;
                    clearResumeHandler();
                };
                video.addEventListener('loadedmetadata', resumeHandler);
            }

            // Set poster for AirPlay bg
            if (currentMovie && currentMovie.poster_url) {
                video.setAttribute('data-poster', currentMovie.poster_url);
            } else {
                video.removeAttribute('data-poster');
            }

            // Update overlay title
            playerOverlay.setTitle(title);

            function attachSource(src) {
                if (hlsObj) {
                    hlsObj.destroy();
                    hlsObj = null;
                }
                if (useMp4 || video.canPlayType('application/vnd.apple.mpegurl')) {
                    console.log("[Play] Gắn nguồn trực tiếp vào video:", src);
                    video.src = src;
                    video.play().catch(err => console.error("[Play] Lỗi video.play():", err));
                    return;
                }
                if (typeof Hls === 'undefined' || !Hls.isSupported()) {
                    console.error("[Play] Trình duyệt không hỗ trợ phát HLS");
                    showPlayerError("Trình duyệt này không phát được HLS.");
                    return;
                }
                console.log("[Play] Sử dụng Hls.js:", src);
                const isTVMode = document.body.classList.contains('device-tv');
                hlsObj = new Hls({
                    maxBufferLength: isTVMode ? 20 : 30,
                    maxMaxBufferLength: isTVMode ? 120 : 600,
                    manifestLoadingMaxRetry: HFPlayerUtils.isProxied(src) ? 1 : 5,
                    lowLatencyMode: !isTVMode
                });
                hlsObj.loadSource(src);
                hlsObj.attachMedia(video);
                hlsObj.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.error("[Play] Lỗi video.play() Hls.js:", err));
                });
                hlsObj.on(Hls.Events.ERROR, (event, data) => {
                    console.warn("[Play] Hls.js error event:", data);
                    if (!data.fatal) return;
                    const manifestFailed = data.type === Hls.ErrorTypes.NETWORK_ERROR && /^manifestLoad/.test(data.details || '');
                    if (manifestFailed && fallbackDirect()) return;
                    showPlayerError(data.type === Hls.ErrorTypes.MEDIA_ERROR ? "Không giải mã được tập này." : "Không phát được tập này.");
                    if (hlsObj) {
                        hlsObj.destroy();
                        hlsObj = null;
                    }
                });
            }

            attachSource(source);
        }

        // Dữ liệu phim (tên, mô tả HTML, slug) chỉ đi vào DOM qua textContent/thuộc tính, không qua innerHTML hay onclick
        function buildDetailView(m, episodesList, isSaved) {
            const frag = document.createDocumentFragment();
            const back = iconButton('detail-back-btn', SVG_BACK, '', () => backToSearchResults());
            back.setAttribute('aria-label', 'Quay lại');
            frag.appendChild(back);

            const head = el('div', 'detail-head');
            const img = el('img', 'detail-poster');
            img.src = m.poster_url || '';
            img.alt = '';
            img.onerror = () => { img.onerror = null; img.src = POSTER_PLACEHOLDER; };
            head.appendChild(img);
            const body = el('div', 'detail-head-body');
            body.appendChild(el('h2', 'detail-hero-title', m.name));
            if (m.origin_name && m.origin_name !== m.name) body.appendChild(el('div', 'detail-hero-subtitle', m.origin_name));
            const names = (a) => (Array.isArray(a) ? a.map(x => (x && x.name) || x).filter(Boolean) : []);
            const year = m.year && String(m.year) !== 'undefined' ? String(m.year) : '';
            body.appendChild(el('div', 'detail-meta', [year, names(m.country)[0], m.time].filter(Boolean).join(' · ')));
            const chips = el('div', 'detail-chips');
            [m.quality].concat(String(m.lang || '').split('+')).map(s => (s || '').trim()).filter(Boolean)
                .forEach(c => chips.appendChild(el('span', 'detail-chip', c)));
            body.appendChild(chips);
            head.appendChild(body);
            frag.appendChild(head);

            const actions = el('div', 'detail-actions');
            actions.appendChild(iconButton('detail-action-play', SVG_PLAY, 'Phát', () => playSelectedMovieDirect(m.name, m.slug)));
            const save = el('button', 'detail-action-side' + (isSaved ? ' is-saved' : ''));
            save.type = 'button';
            save.id = 'btnSaveDetail';
            save.innerHTML = SVG_BOOKMARK;
            const label = el('span', '', isSaved ? 'Đã lưu' : 'Lưu');
            label.id = 'saveBtnText';
            save.appendChild(label);
            save.addEventListener('click', () => toggleSaveMovie(m.slug, m.name, m.poster_url, m.year, m.episode_current, episodesList.length));
            actions.appendChild(save);
            frag.appendChild(actions);

            const overview = HFUtils.stripHtml(m.content);
            if (overview) {
                const p = el('p', 'detail-overview', overview);
                p.addEventListener('click', () => p.classList.toggle('is-open'));
                frag.appendChild(p);
            }
            const genres = names(m.category).slice(0, 3).join(' · ');
            if (genres) frag.appendChild(el('div', 'detail-genres', genres));

            const eps = el('div', 'detail-episodes');
            eps.id = 'detailEpisodeList';
            frag.appendChild(eps);
            return frag;
        }

        async function showMovieDetail(slug) {
            const detailDiv = document.getElementById('movieDetailContainer');
            const resultsDiv = document.getElementById('searchResults');
            const homepageContent = document.getElementById('homepageContent');
            
            if (homepageContent) homepageContent.style.display = 'none';
            resultsDiv.style.display = 'none';
            detailDiv.style.display = 'block';
            detailDiv.innerHTML = '<div class="detail-loading" role="status">Đang tải</div>';
            
            try {
                const res = await fetch(`/api/movie/${slug}`);
                const data = await res.json();
                
                if (data.status === 'success' && data.movie) {
                    const m = data.movie;
                    const episodesList = data.episodes || [];
                    currentDetailEpisodes = episodesList;
                    currentDetailMeta = m;
                    
                    const isSaved = checkIsSaved(m.slug);
                    
                    detailDiv.replaceChildren(buildDetailView(m, episodesList, isSaved));
                    if (window.refreshPlayLabels) refreshPlayLabels();
                    setTimeout(initTabbing, 100);
                    if (episodesList.length > 0) {
                        const savedMovie = savedMoviesList.find(item => item.slug === m.slug);
                        const watchStates = (savedMovie && savedMovie.episode_states) ? savedMovie.episode_states : {};
                        renderEpisodeList(document.getElementById('detailEpisodeList'), {
                            episodes: episodesList,
                            movieSlug: m.slug,
                            watchStates,
                            watchingPct: HFUtils.progressPct(savedMovie),
                            onPlay: (ep) => {
                                if (maybeCast(m.slug, ep.link_m3u8)) return;
                                currentMovie = { slug: m.slug, name: m.name, poster_url: m.poster_url, year: m.year };
                                playEpisodesListDirect(currentDetailEpisodes, ep.link_m3u8);
                            }
                        });
                    }
                } else {
                    detailDiv.innerHTML = '<div style="text-align: center; color: var(--accent-color);">Không thể tải thông tin chi tiết phim.</div>';
                }
            } catch (err) {
                detailDiv.innerHTML = `<div style="text-align: center; color: var(--accent-color);">Lỗi kết nối: ${err.message}</div>`;
            }
        }

        function refreshDetailEpisodeList() {
            const listEl = document.getElementById('detailEpisodeList');
            if (!listEl || !currentDetailEpisodes || currentDetailEpisodes.length === 0) return;
            let watchStates = {};
            let watchingPct = 0;
            let movie = currentMovie;
            if (movie && movie.slug) {
                const saved = savedMoviesList.find(item => item.slug === movie.slug);
                if (saved && saved.episode_states) watchStates = saved.episode_states;
                watchingPct = HFUtils.progressPct(saved);
            }
            renderEpisodeList(listEl, {
                episodes: currentDetailEpisodes,
                movieSlug: movie ? movie.slug : null,
                watchStates,
                watchingPct,
                onPlay: (ep) => {
                    if (movie && maybeCast(movie.slug, ep.link_m3u8)) return;
                    if (movie) currentMovie = { slug: movie.slug, name: movie.name, poster_url: movie.poster_url };
                    playEpisodesListDirect(currentDetailEpisodes, ep.link_m3u8);
                }
            });
        }

        function playSelectedMovieDirect(name, slug) {
            if (maybeCast(slug, null)) return;
            const savedMovie = savedMoviesList.find(item => item.slug === slug);
            const meta = currentDetailMeta && currentDetailMeta.slug === slug ? currentDetailMeta : null;
            currentMovie = {
                slug, name,
                poster_url: (savedMovie && savedMovie.poster_url) || (meta && meta.poster_url) || null,
                year: (savedMovie && savedMovie.year) || (meta && meta.year) || ''
            };
            const targetUrl = savedMovie ? savedMovie.last_watched_url : null;
            playEpisodesListDirect(currentDetailEpisodes, targetUrl);
        }

                savedMoviesList = await res.json();

                renderHomeContinue();

        function checkIsSaved(slug) {

        }

        async function toggleSaveMovie(slug, name, poster_url, year, episode_current, total_episodes, episodes = currentDetailEpisodes) {
            const btn = document.getElementById('btnSaveDetail');
            const txt = document.getElementById('saveBtnText');
            const isSaved = checkIsSaved(slug);
            
            if (isSaved) {
                try {
                    const res = await fetch(`/api/saved/${slug}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.status === 'success') {
                        savedMoviesList = savedMoviesList.filter(item => item.slug !== slug);
                        if (btn) {
                            btn.className = "detail-action-side";
                            txt.textContent = "Lưu";
                        }
                    }
                } catch(e) { alert("Không thể xóa phim: " + e.message); }
            } else {
                try {
                    const res = await fetch('/api/saved', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            slug, 
                            name, 
                            poster_url, 
                            year, 
                            episode_current, 
                            total_episodes,
                            episodes
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        savedMoviesList = savedMoviesList.filter(item => item.slug !== slug).concat(data.movie);
                        if (btn) {
                            btn.className = "detail-action-side is-saved";
                            txt.textContent = "Đã lưu";
                        }
                    }
                } catch(e) { alert("Không thể lưu phim: " + e.message); }
            }
            updateHeroSaveLabels();
        }

        async function deleteSavedMovie(slug) {
            try {
                const res = await fetch(`/api/saved/${slug}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    savedMoviesList = savedMoviesList.filter(item => item.slug !== slug);
                    updateHeroSaveLabels();
                    renderSavedMovies();
                }
            } catch(e) { alert("Lỗi xóa phim: " + e.message); }
        }

        async function syncEpisodesForMovie(slug) {
            try {
                const res = await fetch(`/api/movie/${slug}`);
                const data = await res.json();
                if (data.status === 'success' && data.movie) {
                    const saved = savedMoviesList.find(item => item.slug === slug);
                    if (saved) {
                        saved.episodes = data.episodes || [];
                        await fetch('/api/saved', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(saved)
                        });
                        renderSavedMovies();
                    }
                }
            } catch(e) {
                alert("Lỗi đồng bộ tập phim: " + e.message);
            }
        }

        // Một dòng "đang xem": poster, tên, tập và thời gian còn lại, thanh tiến độ. Chạm là phát tiếp.
        function buildContinueCard(m, className) {
            const card = el('button', className);
            card.type = 'button';
            card.dataset.slug = m.slug;
            const img = el('img', 'continue-poster');
            img.alt = '';
            img.src = m.poster_url || '';
            img.onerror = () => { img.onerror = null; img.src = POSTER_PLACEHOLDER; };
            card.appendChild(img);
            const body = el('span', 'continue-body');
            body.appendChild(el('span', 'continue-title', m.name));
            body.appendChild(el('span', 'continue-ep', HFUtils.continueMeta(m)));
            const bar = el('span', 'continue-progress');
            const fill = el('span', 'continue-progress-fill');
            fill.style.width = HFUtils.progressPct(m) + '%';
            bar.appendChild(fill);
            body.appendChild(bar);
            card.appendChild(body);
            const play = el('span', 'continue-play');
            play.innerHTML = SVG_PLAY;
            card.appendChild(play);
            card.setAttribute('aria-label', `Phát tiếp ${m.name}`);
            card.addEventListener('click', () => { if (!card.dataset.swiped) playResumeSavedMovie(m.slug); });
            const row = el('div', 'swipe-row' + (className.includes('is-lead') ? ' swipe-lead' : ''));
            const act = (cls, svg, label) => {
                const a = el('span', `swipe-act ${cls}`);
                a.setAttribute('aria-hidden', 'true');
                a.innerHTML = svg;
                a.appendChild(el('span', '', label));
                return a;
            };
            row.append(act('swipe-act-play', SVG_PLAY, 'Xem tiếp'), act('swipe-act-remove', SVG_TRASH, 'Bỏ'), card);
            attachContinueSwipe(row, card, m.slug);
            return row;
        }

        // Vuốt ngang thẻ "Xem tiếp" (điện thoại): sang phải phát tiếp, sang trái bỏ khỏi danh sách (có hoàn tác).
        // Hướng chốt ở 8px đầu: dọc thì để trang cuộn, ngang thì thẻ chạy theo ngón tay.
        function attachContinueSwipe(row, card, slug) {
            let x0 = 0, y0 = 0, dx = 0, axis = null, lastX = 0, lastT = 0, v = 0;
            const settle = () => {
                row.classList.remove('is-dragging', 'is-armed');
                delete row.dataset.dir;
                card.style.transform = '';
            };
            card.addEventListener('touchstart', (e) => {
                axis = document.body.classList.contains('device-mobile') && e.touches.length === 1 ? null : 'none';
                if (axis) return;
                const t = e.touches[0];
                x0 = lastX = t.clientX; y0 = t.clientY; lastT = e.timeStamp; dx = 0; v = 0;
            }, { passive: true });
            card.addEventListener('touchmove', (e) => {
                if (axis === 'none' || axis === 'y') return;
                const t = e.touches[0];
                const mx = t.clientX - x0, my = t.clientY - y0;
                if (!axis) {
                    if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
                    axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                    if (axis === 'y') return;
                    row.classList.add('is-dragging');
                }
                if (e.cancelable) e.preventDefault();
                if (e.timeStamp > lastT) v = (t.clientX - lastX) / (e.timeStamp - lastT);
                lastX = t.clientX; lastT = e.timeStamp;
                dx = mx;
                row.dataset.dir = dx > 0 ? 'play' : 'remove';
                row.classList.toggle('is-armed', HFUtils.swipeAction(dx, card.offsetWidth) !== null);
                card.style.transform = `translateX(${dx}px)`;
            }, { passive: false });
            const end = (e) => {
                if (axis !== 'x') return;
                axis = null;
                if (e.timeStamp - lastT > 100) v = 0; // dừng tay rồi mới nhấc: không tính là hất
                const action = e.type === 'touchend' ? HFUtils.swipeAction(dx, card.offsetWidth, v) : null;
                card.dataset.swiped = '1'; // nuốt click trình duyệt có thể bắn ngay sau cú vuốt
                setTimeout(() => { delete card.dataset.swiped; }, 400);
                if (action === 'remove') return removeFromContinue(slug, row);
                settle();
                // Phát ngay trong touchend (cử chỉ người dùng): iOS mới cho video có tiếng chạy
                if (action === 'play') playResumeSavedMovie(slug);
            };
            card.addEventListener('touchend', end);
            card.addEventListener('touchcancel', end);
        }

        // Bỏ khỏi Xem tiếp: ẩn ngay, chờ CONTINUE_UNDO_MS mới gọi server để còn kịp hoàn tác.
        // Chỉ thẻ bỏ gần nhất hoàn tác được; bỏ thẻ khác thì thẻ trước được gửi đi luôn.
        const CONTINUE_UNDO_MS = 5000;
        const continueHidden = new Set();
        let continueRemoval = null;

        function removeFromContinue(slug, row) {
            commitContinueRemoval();
            continueHidden.add(slug);
            continueRemoval = { slug, timer: setTimeout(commitContinueRemoval, CONTINUE_UNDO_MS) };
            document.getElementById('undoToast').classList.add('is-open');
            document.querySelector('#undoToast .undo-btn').tabIndex = 0;
            // Thẻ trượt hẳn sang trái, hàng thu lại, rồi vẽ lại danh sách (thẻ thứ tư lên thay)
            row.style.height = row.offsetHeight + 'px';
            row.classList.remove('is-dragging');
            row.classList.add('is-leaving');
            row.offsetHeight;
            row.classList.add('is-collapsing');
            setTimeout(renderContinueLists, 280);
        }

        function closeUndoToast() {
            document.getElementById('undoToast').classList.remove('is-open');
            document.querySelector('#undoToast .undo-btn').tabIndex = -1;
        }

        async function commitContinueRemoval() {
            const r = continueRemoval;
            if (!r) return;
            continueRemoval = null;
            clearTimeout(r.timer);
            closeUndoToast();
            try {
                const res = await fetch(`/api/saved/${encodeURIComponent(r.slug)}/progress`, { method: 'DELETE', keepalive: true });
                const data = await res.json();
                if (data.status === 'success') {
                    savedMoviesList = data.movie
                        ? savedMoviesList.map(i => i.slug === r.slug ? data.movie : i)
                        : savedMoviesList.filter(i => i.slug !== r.slug);
                }
            } catch (e) { console.warn('Không bỏ được khỏi Xem tiếp', r.slug, e); }
            continueHidden.delete(r.slug);
            renderContinueLists();
        }

        function undoContinueRemoval() {
            const r = continueRemoval;
            if (!r) return;
            continueRemoval = null;
            clearTimeout(r.timer);
            closeUndoToast();
            continueHidden.delete(r.slug);
            renderContinueLists();
        }

        // Rời trang khi đang chờ hoàn tác: gửi luôn (keepalive giữ request sống qua lúc đóng)
        window.addEventListener('pagehide', commitContinueRemoval);

        function libraryParts() {
            const parts = HFUtils.splitLibrary(savedMoviesList);
            parts.continueWatching = parts.continueWatching.filter(m => !continueHidden.has(m.slug));
            return parts;
        }

        function renderContinueLists() {
            renderHomeContinue();
            renderLibraryContinue();
        }

        function renderContinueRow(rows) {
            const row = document.getElementById('continueRow');
            row.innerHTML = '';
            rows.forEach(m => row.appendChild(buildContinueCard(m, 'continue-card')));
        }

        const HOME_CONTINUE_MAX = 3;

        function renderHomeContinue() {
            const section = document.getElementById('homeContinue');
            const list = document.getElementById('homeContinueList');
            if (!section || !list) return;
            const rows = libraryParts().continueWatching.slice(0, HOME_CONTINUE_MAX);
            list.innerHTML = '';
            rows.forEach((m, i) => list.appendChild(buildContinueCard(m, 'home-cont' + (i === 0 ? ' is-lead' : ''))));
            section.hidden = rows.length === 0;
        }

        function renderLibraryContinue() {
            const { continueWatching, saved } = libraryParts();
            document.getElementById('continueSection').hidden = continueWatching.length === 0;
            document.getElementById('savedSection').hidden = saved.length === 0;
            document.getElementById('libraryEmpty').hidden = continueWatching.length + saved.length > 0;
            renderContinueRow(continueWatching);
            return saved;
        }

        async function renderSavedMovies() {
            const grid = document.getElementById('savedMoviesGrid');
            await fetchSavedMovies();

            const saved = renderLibraryContinue();
            grid.innerHTML = '';
            if (saved.length === 0) return;

            // Đã lưu: lưới poster gọn; tập phim xem ở trang chi tiết
            saved.forEach(m => {
                const card = document.createElement('div');
                card.className = 'saved-movie-row';
                card.dataset.slug = m.slug;
                if (!document.body.classList.contains('device-mobile')) {
                    card.setAttribute('tabindex', '0');
                }

                const wrap = el('div', 'poster-wrap');
                const poster = el('img', 'movie-poster');
                poster.src = m.poster_url || '';
                poster.alt = m.name || '';
                poster.loading = 'lazy';
                poster.onerror = () => { poster.onerror = null; poster.src = POSTER_PLACEHOLDER; };
                wrap.appendChild(poster);
                const del = iconButton('btn-sec saved-remove', '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>', '', (e) => { e.stopPropagation(); deleteSavedMovie(m.slug); });
                del.setAttribute('aria-label', `Bỏ lưu ${m.name}`);
                wrap.appendChild(del);
                card.appendChild(wrap);
                card.appendChild(el('div', 'movie-title', m.name));
                card.appendChild(el('div', 'movie-meta', HFUtils.cardMeta({ episode_current: m.episode_current, year: m.year })));
                card.onclick = () => {
                    switchTab('search-tab');
                    showMovieDetail(m.slug);
                };
                grid.appendChild(card);
            });
            renderHomeContinue();
            setTimeout(initTabbing, 100);
        }

        function playEpisodeFromSaved(slug, epIdx) {
            const savedMovie = savedMoviesList.find(item => item.slug === slug);
            if (!savedMovie || !savedMovie.episodes || savedMovie.episodes.length === 0) return;
            if (maybeCast(slug, savedMovie.episodes[epIdx] ? savedMovie.episodes[epIdx].link_m3u8 : null)) return;
            
            currentMovie = { slug: savedMovie.slug, name: savedMovie.name, poster_url: savedMovie.poster_url };
            playEpisodesListDirect(savedMovie.episodes, epIdx);
        }

        async function playResumeSavedMovie(slug) {
            if (maybeCast(slug, null)) return;
            const savedMovie = savedMoviesList.find(item => item.slug === slug);
            if (!savedMovie) return;
            
            if (!savedMovie.episodes || savedMovie.episodes.length === 0) {
                await syncEpisodesForMovie(slug);
                playResumeSavedMovie(slug);
                return;
            }
            
            const { index: targetIdx, url: targetUrl } = HFUtils.resumeTarget(savedMovie, savedMovie.episodes);
            if (!targetUrl) return alert("Không tìm thấy tập phim nào.");

            currentMovie = { slug: savedMovie.slug, name: savedMovie.name, poster_url: savedMovie.poster_url, year: savedMovie.year };
            playEpisodesListDirect(savedMovie.episodes, targetIdx);
        }


        async function loadAndPlayMovie(slug) {
            try {
                const res = await fetch(`/api/movie/${slug}`);
                const data = await res.json();
                if (data.status === 'success' && data.movie) {
                    const savedMovie = savedMoviesList.find(item => item.slug === slug);
                    currentMovie = { slug: data.movie.slug, name: data.movie.name, poster_url: data.movie.poster_url };
                    playEpisodesListDirect(data.episodes, savedMovie ? savedMovie.last_watched_url : null);
                } else {
                    alert("Không thể tải thông tin phim.");
                }
            } catch (err) {
                alert("Lỗi kết nối: " + err.message);
            }
        }

        function playNextEpisode() {
            if (playbackEpisodes.length > 1 && currentPlaybackIndex < playbackEpisodes.length - 1) {
                const nextIdx = currentPlaybackIndex + 1;
                const nextEp = playbackEpisodes[nextIdx];
                play(nextEp.link_m3u8, nextEp.name, nextIdx);
            }
        }

        // Hết tập: đếm ngược rồi tự qua tập kế (có nút Hủy), theo cài đặt của thiết bị
        HFPlayerAuto.init({
            video,
            getEpisodes: () => ({ list: playbackEpisodes, index: currentPlaybackIndex }),
            playNext: playNextEpisode,
        });
        video.onended = () => HFPlayerAuto.onEnded();

        detectDevice();
        fetchSavedMovies();
        // Initialize Smart Homepage
        (async function initHomepage() {
            loadFilterData();
            setupHeroAuto();
            loadHeroItems();
            await fetchHomeSection('all', 1);
            renderGridCards(false);
            setupHomeInfiniteScroll();
        })();
        fetchDownloadStatuses();
        setInterval(fetchDownloadStatuses, 5000);

        // --- FILTER BAR (THỂ LOẠI / QUỐC GIA / NĂM) ---
        let filterData = { categories: null, countries: null };

        async function loadFilterData() {
            try {
                const [catRes, cntRes] = await Promise.all([
                    fetch('/api/home/categories').then(r => r.json()),
                    fetch('/api/home/countries').then(r => r.json())
                ]);
                filterData.categories = (catRes.items || []).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
                filterData.countries = (cntRes.items || []).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
            } catch (e) {
                console.error('Lỗi tải dữ liệu bộ lọc:', e);
            }
        }

        function getFilterLabel(type, value) {
            const list = type === 'category' ? filterData.categories : filterData.countries;
            const found = list && list.find(it => it.slug === value);
            return found ? found.name : value;
        }

        function toggleFilterDropdown(type) {
            const menu = document.getElementById(`filterMenu-${type}`);
            const willOpen = !menu.classList.contains('open');
            closeAllFilterDropdowns();
            if (willOpen) {
                renderFilterOptions(type);
                menu.classList.add('open');
            }
        }

        function closeAllFilterDropdowns() {
            document.querySelectorAll('.filter-menu.open').forEach(m => m.classList.remove('open'));
        }

        function renderFilterOptions(type) {
            const menu = document.getElementById(`filterMenu-${type}`);
            let options = [];
            if (type === 'category') {
                options = (filterData.categories || []).map(c => ({ label: c.name, value: c.slug }));
            } else if (type === 'country') {
                options = (filterData.countries || []).map(c => ({ label: c.name, value: c.slug }));
            } else {
                const y = new Date().getFullYear();
                for (let i = y; i >= 1990; i--) options.push({ label: String(i), value: String(i) });
            }
            const key = homeKey(homeState.activeGridTab);
            const current = homeState[key].filters[type];
            menu.innerHTML = '';
            [{ label: 'Tất cả', value: '' }].concat(options).forEach(o => {
                const btn = el('button', 'filter-option' + (o.value === current ? ' active' : ''), o.label);
                btn.type = 'button';
                btn.addEventListener('click', () => setFilter(type, o.value));
                menu.appendChild(btn);
            });
        }

        function setFilter(type, value) {
            const key = homeKey(homeState.activeGridTab);
            homeState[key].filters[type] = value;
            closeAllFilterDropdowns();
            applyFilter();
        }

        function clearAllFilters() {
            const key = homeKey(homeState.activeGridTab);
            homeState[key].filters = { category: '', country: '', year: '' };
            closeAllFilterDropdowns();
            applyFilter();
        }

        function updateFilterUI() {
            const key = homeKey(homeState.activeGridTab);
            const f = homeState[key].filters;
            const labels = { category: 'Thể loại', country: 'Quốc gia', year: 'Năm' };
            let activeCount = 0;
            for (const type of ['category', 'country', 'year']) {
                const btn = document.getElementById(`filterBtn-${type}`);
                if (!btn) continue;
                const val = f[type];
                btn.classList.toggle('active', !!val);
                btn.textContent = val ? getFilterLabel(type, val) : labels[type];
                if (val) activeCount++;
            }
            const clearBtn = document.getElementById('filterClearBtn');
            if (clearBtn) clearBtn.style.display = activeCount > 0 ? 'inline-block' : 'none';
        }

        // Đóng dropdown khi click ngoài hoặc nhấn ESC
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.filter-dropdown')) closeAllFilterDropdowns();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAllFilterDropdowns();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initTabbing();
        });

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
