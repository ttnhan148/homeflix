        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --surface-elevated: #1a1a1c;
            --accent-color: #E50914;
            --accent-hover: #b20710;
            --accent-gold: #f5c518;
            --text-main: #fafafa;
            --text-dim: #a1a1aa;

            color: var(--text-main);
            min-height: 100dvh;

            flex-direction: column;

            max-width: 1000px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border-strong);
            padding-bottom: 0.5rem;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* --- TAB SYSTEM --- */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--glass-border-strong);
            padding-bottom: 0.75rem;
            width: 100%;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);

        .tab-btn:hover {

            background: rgba(255, 255, 255, 0.04);
            border-color: var(--glass-border);
        }

        .tab-btn.active {
            color: white;
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.3);
        }

        .tab-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- SMOOTH MANUAL INPUT --- */
        .input-card-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease;
            opacity: 0;
        }

        .input-card-wrapper.expanded {
            max-height: 400px;
            opacity: 1;
        }

        /* --- INPUT SECTION --- */
        .input-card {
            background: rgba(18, 18, 20, 0.7);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;

        .input-header {

        .label-text {

            text-transform: uppercase;
            letter-spacing: 0.05em;

        textarea {

            min-height: 90px;

            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
            background: rgba(18, 18, 20, 0.95);
        }

        textarea::placeholder {

        }

        .btn-main {

            text-transform: uppercase;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-glow);
        }

        .btn-main:hover {

            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(229, 9, 20, 0.35);
        }

        .player-wrapper {

            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border-strong);
        }

        .btn-overlay-back {
            display: flex;
            align-items: center;

            border: none;

            font-weight: 600;
            cursor: pointer;

            background: rgba(255, 255, 255, 0.06);
        }

            transition: transform 0.3s ease;

        .episodes-drawer .episodes-drawer-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.75rem 1rem;
        }

            gap: 0.75rem;
            flex-wrap: wrap;

        .ep-pager-btn:hover:not(:disabled) {

            border-color: rgba(229, 9, 20, 0.45);

        .ep-item.is-watching:hover {
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-color);
        }
        .ep-item.active {
            background: rgba(229, 9, 20, 0.12);
            color: var(--accent-color);
            border-color: rgba(229, 9, 20, 0.35);
        }
        @keyframes ep-pulse-accent {
            0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.35); }
            70% { box-shadow: 0 0 0 5px rgba(229, 9, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }

        .detail-episodes {

            border: 1px solid var(--glass-border-strong);

            backdrop-filter: blur(8px);
        }
        /* --- PLAYER TOAST --- */

        /* TV */
        .device-tv .btn-overlay-back {
            font-size: 1rem;
            padding: 0.6rem 1rem;
        }
        /* Mobile */
        .device-mobile .btn-overlay-back {
            font-size: 0.75rem;
            padding: 0.5rem 0.7rem;
        }

        .device-mobile .episodes-drawer .ep-list-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 0.4rem;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            object-fit: contain;
            background-color: var(--bg-color);
        }

        /* --- AIRPLAY REMOTE CONTROL OVERLAY --- */
        .airplay-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .airplay-remote-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 8, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            gap: 1.5rem;
            padding: 2rem;
            z-index: 20;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .airplay-remote-overlay .airplay-bg-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

            position: relative;
            z-index: 1;
        }

            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 2;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-dim);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .airplay-disconnect-btn:hover {
            background: rgba(255,255,255,0.15);
            color: var(--text-main);
        }

            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .airplay-header-btn:hover {
            background: rgba(255,255,255,0.12);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.2);
        }
        .airplay-remote-overlay .airplay-icon {
            font-size: 3rem;
            animation: airplayPulse 2s ease-in-out infinite;
        }

            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .airplay-remote-overlay .airplay-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.03em;
        }

            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 400px;
        }
        .airplay-playpause {

            height: 64px;
            min-width: 64px;
            border-radius: 50%;
            background: var(--accent-color);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--shadow-glow);

            box-shadow: 0 6px 24px rgba(229, 9, 20, 0.35);

            flex-direction: column;
            gap: 0.3rem;
        }

            height: 6px;

            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .airplay-seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 6px rgba(229, 9, 20, 0.5);
        }
        .airplay-seek-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .status-msg {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
            text-align: center;
            background: rgba(18, 18, 20, 0.7);
            padding: 0.6rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }

            box-shadow: var(--shadow-card);

            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }

            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            left: 0;

        .poster-overlay-bottom .overlay-desc {
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-dim);

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;

        .movie-card:hover {

            box-shadow: var(--shadow-elevated);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--surface-elevated);
        }

        .movie-info {
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.4rem;
        }

        .movie-meta {
            font-size: 0.7rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-type {
            background: rgba(229, 9, 20, 0.12);
            color: var(--accent-color);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* --- DETAIL HERO --- */
        .detail-hero {
            position: relative;
            width: 100%;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: var(--bg-color);
            border: 1px solid var(--glass-border-strong);
        }

        .detail-backdrop {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .detail-hero-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to bottom, rgba(8,8,8,0) 0%, rgba(8,8,8,0.95) 100%);
            pointer-events: none;
        }

        .detail-hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            z-index: 1;
        }

        .detail-hero-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .detail-hero-subtitle {
            font-size: 0.85rem;
            font-weight: 400;
            color: #a1a1aa;
        }

        /* --- DETAIL CHIPS --- */
        .detail-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .detail-chip {
            background: var(--surface-elevated);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            white-space: nowrap;
        }

        /* --- DETAIL OVERVIEW --- */
        .detail-overview {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- DETAIL ACTIONS --- */
        .detail-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 2rem;
        }

        .detail-action-side {
            flex: 0 0 40%;
            height: 48px;
            background: var(--surface-elevated);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
        }

        .detail-action-side:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border-color: var(--glass-border-strong);
        }

        .detail-action-side:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border-color: var(--glass-border-strong);
        }

        .detail-action-play {
            flex: 0 0 60%;
            height: 48px;
            background: var(--accent-color);
            border-radius: var(--radius-lg);
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-glow);
        }

        .detail-action-play:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* --- DETAIL BACK BUTTON --- */
        .detail-back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .detail-back-btn:hover {
            color: var(--text-main);
        }


        /* ==========================================================================
           📺 2. SMART TV & PROJECTOR OPTIMIZED LAYOUT (10-foot UI)
           ========================================================================== */
        .device-tv .container {
            max-width: 1300px;
            padding: 2.5rem;
            gap: 2.5rem;
        }

        .device-tv h1 {
            font-size: 2.5rem;
        }

        .device-tv .subtitle {
            font-size: 1.1rem;
        }

        .device-tv .tab-btn {
            font-size: 1.15rem;
            padding: 0.8rem 1.8rem;
            border-radius: var(--radius-xl);
        }

        .device-tv textarea {
            font-size: 1.2rem;
            min-height: 110px;
        }

        .device-tv .btn-main {
            font-size: 1.25rem;
            padding: 0.95rem 2.2rem;
            border-radius: var(--radius-xl);
        }

        .device-tv .status-msg {
            font-size: 1.2rem;
            padding: 1rem;
        }

        .device-tv .ep-item {
            font-size: 1.05rem;
            padding: 1rem 1.2rem;
            border-radius: var(--radius-lg);
        }

        .device-tv .movies-grid {
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1.75rem;
        }

        .device-tv .movie-title {
            font-size: 1.1rem;
            height: 3rem;
        }

        .device-tv .detail-hero-title {
            font-size: 2rem;
        }

        .device-tv .detail-hero-subtitle {
            font-size: 1rem;
        }

        .device-tv .detail-overview {
            font-size: 1rem;
        }

        .device-tv .detail-action-side {
            height: 56px;
            font-size: 1rem;
        }

        .device-tv .detail-action-play {
            height: 56px;
            font-size: 1.1rem;
        }

        /* Hộp viền tập trung (focus ring) cực kỳ nổi bật khi duyệt remote trên TV/Projector */
        .device-tv input:focus, 
        .device-tv textarea:focus, 
        .device-tv button:focus, 
        .device-tv .tab-btn:focus, 
        .device-tv .movie-card:focus, 
        .device-tv .ep-item:focus {
            outline: 4px solid var(--focus-ring) !important;
            outline-offset: 3px;
            transform: scale(1.05);
            z-index: 10;
        }

        .device-tv .movie-card:hover {
            transform: none; /* Bỏ hover máy chiếu tránh lag */
        }


        /* ==========================================================================
           📱 3. IPHONE & IPAD & MOBILE TOUCH OPTIMIZED LAYOUT (Compact & Touch friendly)
           ========================================================================== */
        .device-mobile .container {
            padding: 1rem;
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            gap: 1rem;
        }

        .device-mobile h1 {
            font-size: 1.6rem;
        }

        .device-mobile .subtitle {
            font-size: 0.8rem;
        }

        /* Cuộn ngang các tab menu mượt mà trên màn hình nhỏ */
        .device-mobile .tabs-nav {
            flex-wrap: nowrap;
            overflow-x: auto;
            justify-content: flex-start;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
            gap: 0.5rem;
        }

        .device-mobile .tab-btn {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            flex: 0 0 auto;
        }

        .device-mobile .movies-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .device-mobile .movie-title {
            font-size: 0.85rem;
            height: 2.2rem;
        }

        .device-mobile .ep-item {
            font-size: 0.9rem;
            padding: 0.6rem 0.8rem;
        }

        .device-mobile .detail-hero-title {
            font-size: 1.25rem;
        }

        .device-mobile .detail-hero-subtitle {
            font-size: 0.8rem;
        }

        .device-mobile .detail-hero-content {
            padding: 1rem;
        }

        .device-mobile .detail-chips {
            gap: 6px;
        }

        .device-mobile .detail-overview {
            font-size: 13px;
            -webkit-line-clamp: 3;
        }

        .device-mobile .detail-action-side {
            height: 44px;
            font-size: 13px;
        }

        .device-mobile .detail-action-play {
            height: 44px;
            font-size: 14px;
        }

        /* Tắt viền focus màu vàng xấu xí trên thiết bị di động chạm tay */
        .device-mobile *:focus {
            outline: none !important;
            transform: none !important;
        }

        /* Tắt backdrop-filter trên mobile — gây mất touch event + hao pin */
        .device-mobile .btn-overlay-back,
        .device-mobile .tab-btn,
        .device-mobile .grid-tab-btn,
        .device-mobile .btn-sec,
        .device-mobile .btn-paste,
        .device-mobile .ep-item,
        .device-mobile .episodes-drawer-toggle,
        .device-mobile .search-overlay-close,
        .device-mobile .search-overlay-input,
        .device-mobile .search-bar input,
        .device-mobile textarea,
        .device-mobile .input-card,
        .device-mobile .movie-card,
        .device-mobile .movie-detail-panel,
        .device-mobile .detail-episodes,
        .device-mobile .saved-movie-row,
        .device-mobile .episodes-drawer,
        .device-mobile .status-msg,
        .device-mobile .detail-description,
        .device-mobile .meta-item,
        .device-mobile .search-overlay {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* --- SMARTPAGE: HERO SECTION --- */
        .hero-scroll-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .hero-scroll-grid {
            display: flex;
            overflow-x: auto;
            gap: 1rem;
            padding-bottom: 0.5rem;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .hero-scroll-grid::-webkit-scrollbar {
            height: 6px;
        }

        .hero-scroll-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
        }

        .hero-card {
            flex: 0 0 200px;
            scroll-snap-align: start;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .hero-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: var(--shadow-card);
        }

        .hero-card .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--surface-elevated);
        }

        .hero-card .movie-info {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .hero-card .movie-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-card .movie-meta {
            font-size: 0.65rem;
            color: var(--text-dim);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .hero-card .quality-badge {
            background: rgba(229, 9, 20, 0.12);
            color: var(--accent-color);
            padding: 0.05rem 0.35rem;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .skeleton-card {
            flex: 0 0 200px;
            border-radius: 6px;
            background: #1a1a1a;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .skeleton-card .skeleton-img {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--surface-elevated);
        }

        .skeleton-card .skeleton-text {
            height: 0.8rem;
            margin: 0.5rem;
            background: var(--surface-elevated);
            border-radius: 3px;
        }

        .skeleton-card .skeleton-text-short {
            width: 60%;
            height: 0.6rem;
            margin: 0 0.5rem 0.5rem;
            background: var(--surface-elevated);
            border-radius: 3px;
        }

        /* TV mode */
        .device-tv .hero-card {
            flex: 0 0 250px;
        }

        .device-tv .hero-card .movie-title {
            font-size: 1rem;
        }

        .device-tv .skeleton-card {
            flex: 0 0 250px;
        }

        /* Mobile */
        .device-mobile .hero-card {
            flex: 0 0 160px;
        }

        .device-mobile .skeleton-card {
            flex: 0 0 160px;
        }

        /* --- SMARTPAGE: GRID TABS SECTION --- */
        .grid-tabs-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .grid-tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .grid-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .grid-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--glass-border);
        }

        .grid-tab-btn.active {
            color: white;
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.3);
        }

        .grid-tab-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.25rem;
        }

        .grid-load-more {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 1rem;
        }

        /* --- FILTER BAR & DROPDOWN --- */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }
        .filter-dropdown {
            position: relative;
        }
        .filter-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 0.9rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.06);
        }
        .filter-btn.active {
            color: var(--accent-color);
            border-color: rgba(229,9,20,0.4);
            background: rgba(229,9,20,0.1);
        }
        .filter-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 200px;
            max-height: 300px;
            overflow-y: auto;
            background: #111113;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 0.4rem;
            z-index: 50;
            flex-direction: column;
            gap: 2px;
        }
        .filter-menu.open {
            display: flex;
        }
        .filter-option {
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-option:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
        }
        .filter-option.active {
            color: var(--accent-color);
            background: rgba(229,9,20,0.1);
        }
        .filter-clear-btn {
            background: transparent;
            border: 1px solid rgba(229,9,20,0.4);
            color: var(--accent-color);
            font-size: 0.75rem;
            padding: 0.4rem 0.7rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-clear-btn:hover {
            background: rgba(229,9,20,0.12);
        }
        .filter-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            padding: 3rem 0;
        }
        .filter-menu::-webkit-scrollbar {
            width: 6px;
        }
        .filter-menu::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
        }
        .device-mobile .grid-tabs-nav {
            flex-wrap: wrap;
        }
        .device-mobile .filter-bar {
            margin-left: 0;
            width: 100%;
            flex-wrap: wrap;
        }
        .device-tv .filter-btn,
        .device-tv .filter-option,
        .device-tv .filter-clear-btn {
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
        }
        .device-tv .filter-btn:focus-visible,
        .device-tv .filter-option:focus-visible,
        .device-tv .filter-clear-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* TV mode */
        .device-tv .grid-tab-btn {
            font-size: 1rem;
            padding: 0.7rem 1.4rem;
        }

        .device-tv .grid-tab-content {
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        /* Mobile */
        .device-mobile .grid-tab-content {
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        /* --- SEARCH OVERLAY --- */
        .search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            overflow-y: auto;
            padding: 1.5rem;
        }

        .search-overlay.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-overlay-header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .search-overlay-close {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .search-overlay-close:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.04);
            border-color: var(--glass-border-strong);
        }

        .search-overlay .movies-grid {
            width: 100%;
            max-width: 1000px;
        }

        .search-overlay-input-wrap {
            flex: 1;
            position: relative;
            max-width: 400px;
        }

        .search-overlay-input-wrap:focus-within .search-input-icon {
            color: var(--accent-color);
        }

        .search-overlay-input {
            width: 100%;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-overlay-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
            background: rgba(18, 18, 20, 0.95);
        }

        .search-overlay-input::placeholder {
            color: var(--text-muted);
        }

        /* Skeleton pulse animation */
        @keyframes skeleton-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* --- SAVED MOVIES LIST & EPISODES COLOR-CODING --- */
        .saved-movies-list-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
        }

        .saved-movie-row {
            display: flex;
            background: rgba(18, 18, 20, 0.7);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            gap: 1.25rem;
            border: 1px solid var(--glass-border-strong);
            align-items: flex-start;
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }

        .saved-movie-row:hover {
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: var(--shadow-elevated);
        }

        .saved-movie-row .movie-poster {
            width: 110px;
            height: 165px;
            object-fit: cover;
            border-radius: var(--radius-md);
            flex-shrink: 0;
            border: 1px solid var(--glass-border);
        }

        .saved-movie-row .movie-info-row {
            display: flex;
            flex-direction: column;

        const inputArea = document.getElementById('m3u8InputRaw');

// --- Episodes Drawer ---
let episodesDrawerExpanded = true;

function buildEpisodesDrawer() {
    const existing = document.getElementById('episodesDrawerEl');
    if (existing) existing.remove();
    
    const drawer = document.createElement('div');
    drawer.id = 'episodesDrawerEl';
    drawer.className = 'episodes-drawer expanded';
    
    const toggle = document.createElement('button');
    toggle.className = 'episodes-drawer-toggle';
    toggle.innerHTML = `<span><span id="epCount">0</span> tập</span><svg class="drawer-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
    toggle.onclick = toggleEpisodesDrawer;
    
    const grid = document.createElement('div');
    grid.className = 'episodes-drawer-grid';
    grid.id = 'drawerEpGrid';
    
    drawer.appendChild(toggle);
    drawer.appendChild(grid);
    
    return drawer;
}

function toggleEpisodesDrawer() {
    const drawer = document.getElementById('episodesDrawerEl');
    if (!drawer) return;
    episodesDrawerExpanded = !episodesDrawerExpanded;
    drawer.className = 'episodes-drawer ' + (episodesDrawerExpanded ? 'expanded' : 'collapsed');
}

        function buildEpisodesGridInDrawer(episodesArray, playIdx) {
            const grid = document.getElementById('drawerEpGrid');
            if (!grid) return;

            const countEl = document.getElementById('epCount');
            if (countEl) countEl.textContent = episodesArray.length;

            const safePlayIdx = Math.max(0, playIdx || 0);
            grid._epChunk = Math.floor(safePlayIdx / EP_CHUNK);

            let watchStates = {};
            if (currentMovie && currentMovie.slug) {
                const saved = savedMoviesList.find(item => item.slug === currentMovie.slug);
                if (saved && saved.episode_states) watchStates = saved.episode_states;
            }

            renderEpisodeList(grid, {
                episodes: episodesArray,
                movieSlug: currentMovie ? currentMovie.slug : null,
                watchStates,
                showTitle: false,
                onPlay: (ep, i) => play(ep.link_m3u8, ep.name, i)
            });

            const localIdx = safePlayIdx - grid._epChunk * EP_CHUNK;
            const activeBtn = grid.querySelectorAll('.ep-item')[localIdx];
            if (activeBtn) activeBtn.classList.add('active');
        }

        function syncDrawerToPlaying(url) {
            const grid = document.getElementById('drawerEpGrid');
            if (!grid) return;
            const epIdx = playbackEpisodes.findIndex(ep => ep.link_m3u8 === url);
            if (epIdx === -1) return;
            const targetChunk = Math.floor(epIdx / EP_CHUNK);
            if (grid._epChunk !== targetChunk) {
                grid._epChunk = targetChunk;
                buildEpisodesGridInDrawer(playbackEpisodes, epIdx);
            } else {
                grid.querySelectorAll('.ep-item').forEach(b => b.classList.toggle('active', b.__epUrl === url));
            }
        }

        // --- Unified Episode List (dùng chung detail + drawer + saved) ---
        const EP_CHUNK = 100;

        function el(tag, className, text) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (text !== undefined) n.textContent = text;
            return n;
        }

        function renderEpisodeList(containerEl, opts) {
            if (!containerEl) return;
            const { episodes, movieSlug, watchStates, onPlay, autoFocusWatching, showTitle, showMeta, watchingPct } = opts;
            if (!episodes || episodes.length === 0) {
                containerEl.innerHTML = '';
                return;
            }
            const ws = watchStates || {};
            const total = episodes.length;
            const chunkCount = Math.max(1, Math.ceil(total / EP_CHUNK));

            let chunk = containerEl._epChunk;
            if (typeof chunk !== 'number' || chunk < 0 || chunk >= chunkCount) {
                chunk = 0;
                if (autoFocusWatching !== false) {
                    const wIdx = episodes.findIndex(ep => ws[ep.link_m3u8] === 'watching');
                    if (wIdx > -1) chunk = Math.floor(wIdx / EP_CHUNK);
                }
            }
            containerEl._epChunk = chunk;

            containerEl.innerHTML = '';

            const list = el('div', 'ep-list');

            const start = chunk * EP_CHUNK;
            const slice = episodes.slice(start, start + EP_CHUNK);

            const header = el('div', 'ep-list-header');
            if (showTitle !== false) {
                header.appendChild(el('span', 'ep-list-title', `${total} tập`));
            }
            if (showMeta !== false) {
                const metaBits = [];
                const watchedCount = Object.values(ws).filter(s => s === 'watched').length;
                if (watchedCount > 0) metaBits.push(`Đã xem ${watchedCount}`);
                let dlCount = 0;
                if (movieSlug && downloadStatuses[movieSlug]) {
                    dlCount = Object.values(downloadStatuses[movieSlug]).filter(s => s === 'completed').length;
                }
                if (dlCount > 0) metaBits.push(`Đã tải ${dlCount}`);
                if (metaBits.length) header.appendChild(el('span', 'ep-list-meta', metaBits.join(' · ')));
            }
            if (header.childElementCount > 0) list.appendChild(header);

            if (chunkCount > 1) {
                const pager = el('div', 'ep-list-pager');
                const prev = el('button', 'ep-pager-btn', '‹');
                prev.disabled = chunk === 0;
                prev.title = 'Trang trước';
                prev.onclick = () => {
                    containerEl._epChunk = chunk - 1;
                    renderEpisodeList(containerEl, opts);
                };
                pager.appendChild(prev);
                pager.appendChild(el('span', 'ep-pager-label', `Tập ${start + 1}–${Math.min(start + EP_CHUNK, total)} / ${total}`));
                const next = el('button', 'ep-pager-btn', '›');
                next.disabled = chunk >= chunkCount - 1;
                next.title = 'Trang sau';
                next.onclick = () => {
                    containerEl._epChunk = chunk + 1;
                    renderEpisodeList(containerEl, opts);
                };
                pager.appendChild(next);
                const jump = el('input', 'ep-jump-input');
                jump.type = 'number';
                jump.min = 1;
                jump.max = total;
                jump.placeholder = 'Nhảy tới tập';
                jump.onkeydown = (e) => {
                    if (e.key !== 'Enter') return;
                    const n = parseInt(jump.value, 10);
                    if (!isNaN(n)) {
                        const idx = Math.min(total - 1, Math.max(0, n - 1));
                        containerEl._epChunk = Math.floor(idx / EP_CHUNK);
                        renderEpisodeList(containerEl, opts);
                    }
                };
                pager.appendChild(jump);
                list.appendChild(pager);
            }

            const grid = el('div', 'ep-list-grid');
            slice.forEach((ep, i) => {
                const realIdx = start + i;
                const btn = el('button', 'ep-item');
                btn.__epUrl = ep.link_m3u8;

                const st = ws[ep.link_m3u8];
                if (st === 'watching') {
                    btn.classList.add('is-watching');
                    btn.title = 'Đang xem — tiếp tục';
                } else if (st === 'watched') {
                    btn.classList.add('is-watched');
                    btn.title = 'Đã xem';
                }

                if (st === 'watched') {
                    const wsIcon = el('span', 'ep-watch-state');
                    wsIcon.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
                    btn.appendChild(wsIcon);
                }

                btn.appendChild(el('span', 'ep-name', HFUtils.epShort(ep.name)));
                btn.setAttribute('aria-label', ep.name + (st === 'watched' ? ', đã xem' : st === 'watching' ? ', đang xem' : ''));
                if (st === 'watching' && watchingPct > 0) {
                    const bar = el('span', 'ep-progress');
                    const fill = el('span', 'ep-progress-fill');
                    fill.style.width = watchingPct + '%';
                    bar.appendChild(fill);
                    btn.appendChild(bar);
                }

                if (movieSlug) {
                    const indicator = el('span', 'ep-dl-indicator not_started');
                    indicator.setAttribute('data-movie-slug', movieSlug);
                    indicator.setAttribute('data-ep-name', ep.name);
                    indicator.setAttribute('data-ep-url', ep.link_m3u8);
                    indicator.onclick = (e) => requestDownloadEpisode(e, movieSlug, ep.name, ep.link_m3u8);
                    btn.appendChild(indicator);
                }

                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (onPlay) onPlay(ep, realIdx);
                };
                grid.appendChild(btn);
            });
            list.appendChild(grid);
            containerEl.appendChild(list);
        }

        video.addEventListener('play', () => {
            if (!hasEnteredFullscreen && video.webkitSupportsFullscreen) {
                video.webkitEnterFullscreen();
                hasEnteredFullscreen = true;
            }
        });

// Desktop auto-fullscreen on first play
video.addEventListener('play', () => {

        const el = document.documentElement;
        if (el.requestFullscreen && !document.fullscreenElement) {
            el.requestFullscreen().catch(() => {});
        }
        hasEnteredFullscreen = true;
    }
});

// --- Gửi vị trí xem (giây) về server, theo từng thiết bị ---
const POSITION_REPORT_INTERVAL_MS = 10000;
// Chỉ báo vị trí sau khi media của tập mới tải xong metadata, tránh gửi giây của tập cũ
let positionTrackReady = false;
video.addEventListener('loadedmetadata', () => { positionTrackReady = true; });

// Listener đặt lại vị trí khi tập sắp phát có vị trí xem dở. Phải gỡ khi đổi tập hoặc thoát,
// nếu không nó sẽ tua nhầm tập kế tiếp tới giây của tập trước.
let resumeHandler = null;
function clearResumeHandler() {
    if (resumeHandler) {
        video.removeEventListener('loadedmetadata', resumeHandler);
        resumeHandler = null;
    }
}

function reportPosition(useBeacon) {
    if (!positionTrackReady || !currentMovie || !currentMovie.slug) return;
    if (!document.body.classList.contains('player-active')) return;
    const ep = playbackEpisodes && playbackEpisodes[currentPlaybackIndex];
    if (!ep || !isFinite(video.duration) || video.currentTime < 1) return;
    const body = {
        slug: currentMovie.slug,
        last_watched_episode: ep.name,
        last_watched_url: ep.link_m3u8,
        position: video.currentTime,
        duration: video.duration
    };
    const saved = savedMoviesList.find(i => i.slug === currentMovie.slug);
    if (saved && saved.last_watched_url === ep.link_m3u8) {
        saved.position = body.position;
        saved.duration = body.duration;
    }
    const payload = JSON.stringify(body);
    if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon('/api/saved/progress', new Blob([payload], { type: 'application/json' }));
    } else {
        fetch('/api/saved/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
        }).catch(() => {});
    }
}

setInterval(() => { if (!video.paused) reportPosition(false); }, POSITION_REPORT_INTERVAL_MS);
video.addEventListener('pause', () => reportPosition(false));
window.addEventListener('pagehide', () => reportPosition(true));
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') reportPosition(true);
});

        // --- AirPlay Remote Control Mode ---
        let isAirplayActive = false;
        let airplaySeekInterval = null;
        let isAirplayAvailable = false;

        // Phát hiện AirPlay khả dụng
        if (typeof video.webkitSupportsAirPlay === 'function') {
            video.webkitShowPlaybackTargetPicker = video.webkitShowPlaybackTargetPicker || function(){};
        }
        video.addEventListener('webkitplaybacktargetavailabilitychanged', (e) => {
            isAirplayAvailable = e.availability === 'available';
            toggleAirplayBtn();
        });

        video.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', () => {
            const isWireless = video.webkitCurrentPlaybackTargetIsWireless;
            toggleRemoteMode(isWireless);
        });

        // Thêm AirPlay btn vào player header
        function toggleAirplayBtn() {
            let btn = document.getElementById('airplayHeaderBtn');
            if (isAirplayAvailable && !isAirplayActive) {
                if (!btn) {
                    btn = document.createElement('button');
                    btn.id = 'airplayHeaderBtn';
                    btn.className = 'airplay-header-btn';
                    btn.title = 'Phát qua AirPlay';
                    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 22h12l-6-8-6 8z"/><rect x="4" y="2" width="16" height="14" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        if (video.webkitShowPlaybackTargetPicker) {
                            video.webkitShowPlaybackTargetPicker();
                        }
                    };
                    const headerRight = document.getElementById('playerHeaderRight');
                    if (headerRight) headerRight.appendChild(btn);
                }
            } else {
                if (btn) btn.remove();
            }
        }

        function disconnectAirPlay() {
            // Ngắt AirPlay bằng cách clear source — force disconnect
            video.pause();
            const wasSrc = video.src;
            video.removeAttribute('src');
            video.load();
            toggleRemoteMode(false);
            isAirplayActive = false;
            // Khôi phục lại video về local sau 200ms
            setTimeout(() => {
                if (wasSrc && !isAirplayActive) {
                    video.src = wasSrc;
                    video.play().catch(() => {});
                }
            }, 300);
        }

        function toggleRemoteMode(isWireless) {
            const overlay = document.getElementById('airplayOverlay');
            isAirplayActive = isWireless;

            if (isWireless) {
                // Giữ video alive (không display:none) — set opacity 0 để AirPlay ổn định
                video.classList.add('airplay-hidden');
                overlay.style.display = 'flex';
                // Gán poster nếu có
                const posterImg = document.getElementById('airplayBgPoster');
                const currentPoster = video.getAttribute('data-poster');
                if (currentPoster && posterImg) posterImg.src = currentPoster;
                startAirplaySeekSync();
                updateAirplayPlayPauseIcon();
                toggleAirplayBtn();
            } else {
                video.classList.remove('airplay-hidden');
                overlay.style.display = 'none';
                stopAirplaySeekSync();
                toggleAirplayBtn();
                // Resume local playback nếu video đang phát mà bị ngắt AirPlay
                if (!video.paused) {
                    video.play().catch(() => {});
                }
            }
        }

        function toggleAirplayPlayPause() {
            if (video.paused) {
                video.play().catch(e => console.warn('[AirPlay] play error:', e));
            } else {
                video.pause();
            }
            updateAirplayPlayPauseIcon();
        }

        function updateAirplayPlayPauseIcon() {
            const iconPath = document.getElementById('airplayPlayPauseIcon');
            if (!iconPath) return;
            if (video.paused) {
                iconPath.setAttribute('d', 'M8 5v14l11-7z');
            } else {
                iconPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function startAirplaySeekSync() {
            stopAirplaySeekSync();
            const seekBar = document.getElementById('airplaySeekBar');
            const timeCurrent = document.getElementById('airplayTimeCurrent');
            const timeDuration = document.getElementById('airplayTimeDuration');

            airplaySeekInterval = setInterval(() => {
                if (!video.duration) return;
                seekBar.max = video.duration;
                seekBar.value = video.currentTime;
                timeCurrent.textContent = formatTime(video.currentTime);
                timeDuration.textContent = formatTime(video.duration);
                updateAirplayPlayPauseIcon();
            }, 500);

            seekBar.oninput = () => {
                video.currentTime = parseFloat(seekBar.value);
            };
        }

        function stopAirplaySeekSync() {
            if (airplaySeekInterval) {
                clearInterval(airplaySeekInterval);
                airplaySeekInterval = null;
            }
        }

        // Trạng thái phim đang phát hiện tại (dùng để lưu tiến độ xem)
        let currentMovie = null;
        let castStartAt = null; // giây bắt đầu do lệnh cast chỉ định (null: dùng tiến độ đã lưu)
        // Danh sách phim lưu trên server
        let savedMoviesList = [];
        // Danh sách tập phim đang xem ở phần chi tiết
        let currentDetailEpisodes = [];
        let currentDetailMeta = null; // movie của trang chi tiết đang mở
        // Theo dõi danh sách tập đang phát và vị trí hiện tại
        let playbackEpisodes = [];
        let currentPlaybackIndex = -1;

        let downloadStatuses = {};

        // --- Smart Homepage State ---
        const newListState = () => ({ items: [], page: 1, loading: false, hasMore: true, fetchSeq: 0, total: null, fetchError: false, deadTypes: new Set(), filters: { category: '', country: '', year: '' } });
        let homeState = {
            all: newListState(),
            phimLe: newListState(),
            phimChieuRap: newListState(),
            phimBo: newListState(),
            tvShows: newListState(),
            activeGridTab: 'all'
        };

        // cast.js đăng ký window.__castRoute; nếu nó không nạp được thì mọi nút Phát vẫn phát cục bộ
        function maybeCast(slug, episodeUrl) {
            return typeof window.__castRoute === 'function' ? window.__castRoute(slug, episodeUrl) : false;
        }

        function homeKey(tab) {
            const map = { 'all': 'all', 'phim-chieu-rap': 'phimChieuRap', 'phim-le': 'phimLe', 'phim-bo': 'phimBo', 'tv-shows': 'tvShows' };
            return map[tab] || 'all';
        }

        const TYPE_ENDPOINTS = {
            'phim-chieu-rap': '/api/home/phim-chieu-rap',
            'phim-le': '/api/home/phim-le',
            'phim-bo': '/api/home/phim-bo',
            'tv-shows': '/api/home/tv-shows'
        };
        // "Tất cả" có bộ lọc: /api/home/latest không lọc được nên hỏi song song ba loại rồi gộp
        const FANOUT_TYPES = ['phim-le', 'phim-bo', 'tv-shows'];

        function hasActiveFilter(f) {
            return !!(f && (f.category || f.country || f.year));
        }

        function filterQuery(f) {
            let q = '';
            if (f.category) q += `&category=${encodeURIComponent(f.category)}`;
            if (f.country) q += `&country=${encodeURIComponent(f.country)}`;
            if (f.year) q += `&year=${encodeURIComponent(f.year)}`;
            return q;
        }

        async function fetchListJson(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                return res.ok && !data.error ? data : null;
            } catch (e) {
                console.warn('Lỗi tải danh sách', url, e);
                return null;
            }
        }

        async function fetchHomeSection(section, page) {
            const state = homeState[homeKey(section)];
            if (state.loading || !state.hasMore) return;

            state.loading = true;
            state.page = page || state.page;
            const mySeq = ++state.fetchSeq;

            try {
                let items, hasMore, total, failed;
                if (section === 'all' && hasActiveFilter(state.filters)) {
                    const types = FANOUT_TYPES.filter(t => !state.deadTypes.has(t));
                    const pages = await Promise.all(types.map(t =>
                        fetchListJson(`${TYPE_ENDPOINTS[t]}?page=${state.page}${filterQuery(state.filters)}`)));
                    if (mySeq !== state.fetchSeq) return;
                    types.forEach((t, i) => { if (!pages[i]) state.deadTypes.add(t); });
                    ({ items, hasMore, total } = HFUtils.mergeTypePages(pages));
                    failed = pages.every(p => !p);
                } else {
                    const url = section === 'all'
                        ? `/api/home/latest?page=${state.page}`
                        : `${TYPE_ENDPOINTS[section]}?page=${state.page}${filterQuery(state.filters)}`;
                    const data = await fetchListJson(url);
                    if (mySeq !== state.fetchSeq) return;
                    failed = !data;
                    items = data ? (data.items || []) : [];
                    const pag = (data && data.pagination) || {};
                    hasMore = items.length > 0 && !(pag.currentPage >= pag.totalPages);
                    total = Number.isFinite(pag.totalItems) ? pag.totalItems : null;
                }

                state.fetchError = failed;
                if (failed) {
                    state.hasMore = false; // không thử lại vô hạn khi cuộn
                    return;
                }
                state.hasMore = hasMore;
                state.total = total;
                state.items = state.page === 1 ? items : state.items.concat(items);
            } finally {
                if (mySeq === state.fetchSeq) state.loading = false;
            }
        }

        function applyFilter() {
            const tab = homeState.activeGridTab;
            const state = homeState[homeKey(tab)];
            Object.assign(state, { items: [], page: 1, loading: false, hasMore: true, total: null, fetchError: false, deadTypes: new Set() });
            updateFilterUI();
            const pending = fetchHomeSection(tab, 1);
            renderGridCards(false); // hiện skeleton ngay
            pending.then(() => {
                renderGridCards(false);
                setupHomeInfiniteScroll();

        // --- HERO (phim hot chiếu rạp) ---
        const HERO_IMAGE_FIELD = 'thumb_url'; // đổi sang 'poster_url' nếu hướng ảnh không hợp
        const HERO_COUNT = 10;
        const HERO_AUTO_MS = 4500;
        const heroState = { items: [], details: {}, pending: {}, index: 0, loaded: false };
        // Tự trượt: chỉ khi hàng đang hiện trên màn hình và không ai chạm, trỏ chuột hay focus vào nó
        const heroAuto = { timer: 0, running: false, onScreen: false, holds: new Set() };
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

        // Đếm lại từ đầu sau mỗi lần dừng: thẻ không nhảy ngay lúc vừa buông tay
        function heroAutoRestart() {
            clearTimeout(heroAuto.timer);
            heroAuto.running = heroState.items.length > 1 && heroAuto.onScreen && !heroAuto.holds.size
                && !document.hidden && !reducedMotion.matches;
            if (!heroAuto.running) return;
            heroAuto.timer = setTimeout(() => {
                // Đang mở trình phát (phủ lên trang chủ): giữ nguyên thẻ, chờ lượt sau
                if (!document.body.classList.contains('player-active')) {
                    const track = document.getElementById('heroTrack');
                    const atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
                    showHeroSlide(HFUtils.heroNext(heroState.index, heroState.items.length, atEnd), { scroll: true });
                }
                heroAutoRestart();
            }, HERO_AUTO_MS);
        }

        function heroHold(reason, on) {
            heroAuto.holds[on ? 'add' : 'delete'](reason);
            heroAutoRestart();
        }

        function setupHeroAuto() {
            const hero = document.getElementById('hero');
            const track = document.getElementById('heroTrack');
            track.addEventListener('touchstart', () => heroHold('touch', true), { passive: true });
            track.addEventListener('touchend', () => heroHold('touch', false));
            track.addEventListener('touchcancel', () => heroHold('touch', false));
            track.addEventListener('wheel', heroAutoRestart, { passive: true });
            hero.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') heroHold('hover', true); });
            hero.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') heroHold('hover', false); });
            hero.addEventListener('focusin', () => heroHold('focus', true));
            hero.addEventListener('focusout', e => { if (!hero.contains(e.relatedTarget)) heroHold('focus', false); });
            new IntersectionObserver(([e]) => {
                heroAuto.onScreen = e.isIntersecting;
                heroAutoRestart();
            }, { threshold: 0.5 }).observe(hero);
            document.addEventListener('visibilitychange', heroAutoRestart);
            reducedMotion.addEventListener('change', heroAutoRestart);
        }

        async function loadHeroItems() {
            for (const path of ['/api/home/phim-chieu-rap', '/api/home/phim-le']) {
                try {
                    const res = await fetch(`${path}?page=1`);
                    const data = await res.json();
                    if (res.ok && !data.error && (data.items || []).length) {
                        heroState.items = data.items.slice(0, HERO_COUNT);
                        break;
                    }
                } catch (e) { console.warn('Hero: lỗi tải', path, e); }
            }
            heroState.loaded = true;
            renderHero();
        }

        function heroImage(m) {
            return m[HERO_IMAGE_FIELD] || m.poster_url || m.thumb_url || '';
        }

        function heroSlideEl(slug) {
            return [...document.querySelectorAll('.hero-slide')].find(s => s.dataset.slug === slug) || null;
        }

        function fillHeroSlide(slug) {
            const slide = heroSlideEl(slug);
            const d = heroState.details[slug];
            if (!slide || !d) return;
            slide.querySelector('.hero-meta').textContent = HFUtils.heroMeta(d.movie);
        }

        function loadHeroDetail(slug) {
            if (heroState.details[slug]) return Promise.resolve(heroState.details[slug]);
            if (!heroState.pending[slug]) {
                heroState.pending[slug] = fetch(`/api/movie/${encodeURIComponent(slug)}`)
                    .then(r => r.json())
                    .then(d => {
                        if (d.status !== 'success' || !d.movie) return null;
                        heroState.details[slug] = d;
                        fillHeroSlide(slug);
                        return d;
                    })
                    .catch(e => { console.warn('Hero: lỗi tải chi tiết', slug, e); return null; })
                    .finally(() => { delete heroState.pending[slug]; });
            }
            return heroState.pending[slug];
        }

        function updateHeroSaveLabels() {

        // Phát ngay trong cú chạm: chi tiết đã tải trước nên không có await nào chen giữa.
        function heroPlay(slug) {
            if (maybeCast(slug, null)) return;
            const d = heroState.details[slug];
            if (!d) {
                // Chưa tải xong: báo đang tải, người dùng chạm lại khi xong (không phát bất đồng bộ, iOS sẽ chặn)

        function buildHeroSlide(m) {
            const slide = el('article', 'hero-slide');
            slide.dataset.slug = m.slug;
            const media = el('div', 'hero-media');
            const img = el('img', 'hero-bg');
            img.alt = '';
            img.loading = 'lazy';
            img.src = heroImage(m);
            img.onerror = () => { img.onerror = null; img.src = m.poster_url || POSTER_PLACEHOLDER; };
            media.appendChild(img);
            media.addEventListener('click', () => showMovieDetailBySlug(m.slug));
            slide.appendChild(media);
            const content = el('div', 'hero-content');
            content.appendChild(el('h3', 'hero-title', m.name));
            content.appendChild(el('div', 'hero-meta', HFUtils.heroMeta({ year: m.year })));
            const actions = el('div', 'hero-actions');
            const play = el('button', 'hero-btn-play', 'Phát');
            play.type = 'button';
            play.addEventListener('click', () => heroPlay(m.slug));
            const save = el('button', 'hero-btn-save', 'Lưu');
            save.type = 'button';
            save.addEventListener('click', () => heroToggleSave(m.slug));
            actions.append(play, save);
            content.appendChild(actions);
            slide.appendChild(content);
            return slide;

        function showHeroSlide(i, opts) {
            const n = heroState.items.length;
            if (!n) return;
            i = Math.max(0, Math.min(n - 1, i));
            heroState.index = i;
            document.querySelectorAll('.hero-dot').forEach((d, k) => d.classList.toggle('active', k === i));
            if (opts && opts.scroll) {
                const track = document.getElementById('heroTrack');
                const slides = track.querySelectorAll('.hero-slide');
                track.scrollTo({ left: slides[i].offsetLeft - slides[0].offsetLeft, behavior: 'smooth' });
            }
            loadHeroDetail(heroState.items[i].slug);
            if (i + 1 < n) loadHeroDetail(heroState.items[i + 1].slug);
        }

        function renderHero() {
            const hero = document.getElementById('hero');
            const track = document.getElementById('heroTrack');
            const dots = document.getElementById('heroDots');
            track.innerHTML = '';
            dots.innerHTML = '';
            const n = heroState.items.length;
            hero.hidden = n === 0;
            if (!n) return;
            const slides = heroState.items.map(buildHeroSlide);
            slides.forEach((slide, k) => {
                track.appendChild(slide);
                dots.appendChild(el('span', 'hero-dot' + (k === 0 ? ' active' : '')));
            });
            dots.hidden = n < 2;
            // Nhiều thẻ hiện cùng lúc: thẻ "hiện tại" là thẻ trái nhất đang hiện; tải trước nó, các thẻ đang hiện và thẻ kế
            const visible = new Set();
            const io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    const k = slides.indexOf(e.target);
                    if (e.isIntersecting) visible.add(k); else visible.delete(k);
                });
                if (!visible.size) return;
                visible.forEach(k => loadHeroDetail(heroState.items[k].slug));
                showHeroSlide(Math.min(...visible));
            }, { root: track, threshold: 0.6 });
            slides.forEach(sl => io.observe(sl));
            hero.onkeydown = (e) => {
                if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
                const slide = e.target.closest('.hero-slide');
                if (!slide) return;
                e.preventDefault();
                const at = slides.indexOf(slide);
                const play = slide.querySelector('.hero-btn-play');
                const save = slide.querySelector('.hero-btn-save');
                // Phát và Lưu nằm cạnh nhau: mũi tên chuyển giữa hai nút trước, hết nút mới đổi thẻ
                if (e.key === 'ArrowRight' && e.target === play) return save.focus();
                if (e.key === 'ArrowLeft' && e.target === save) return play.focus();
                const next = at + (e.key === 'ArrowRight' ? 1 : -1);
                if (next < 0 || next >= n) return;
                showHeroSlide(next, { scroll: true });
                slides[next].querySelector('.hero-btn-play').focus({ preventScroll: true });
            };
            updateHeroSaveLabels();
            if (window.refreshPlayLabels) refreshPlayLabels();
            showHeroSlide(0);
            heroAutoRestart();
        }

        const POSTER_PLACEHOLDER = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22><rect fill=%22%23222%22 width=%22200%22 height=%22300%22/></svg>';

        function buildMovieCard(movie) {
            const card = el('div', 'movie-card');

            card.appendChild(wrap);

            info.appendChild(el('div', 'movie-meta', HFUtils.cardMeta(movie)));

        function renderGridCards(append) {
            const grid = document.getElementById('homeGridContent');
            if (!grid) return;

            const oldLoader = document.getElementById('gridLoader');
            if (oldLoader) oldLoader.remove();

            const state = homeState[homeKey(homeState.activeGridTab)];

            if (!append) {
                if (state.items.length === 0 && state.loading) {
                    grid.innerHTML = Array(9).fill(0).map(() => `
                        <div class="skeleton-card" aria-hidden="true">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-text"></div>
                            <div class="skeleton-text-short"></div>
                        </div>
                    `).join('');
                    updateResultCount();
                    return;
                }
                if (state.items.length === 0) {
                    const msg = state.fetchError ? 'Không tải được phim. Thử lại sau.'
                        : hasActiveFilter(state.filters) ? 'Không có phim phù hợp.'
                        : 'Chưa có phim.';
                    grid.innerHTML = '';
                    grid.appendChild(el('div', 'filter-empty', msg));
                    updateResultCount();
                    return;
                }
                grid.innerHTML = '';
            }

            const startIdx = append ? grid.querySelectorAll('.movie-card').length : 0;
            for (let i = startIdx; i < state.items.length; i++) grid.appendChild(buildMovieCard(state.items[i]));

            if (state.hasMore) {
                const loader = el('div', 'grid-load-more', 'Đang tải thêm');
                loader.id = 'gridLoader';
                loader.setAttribute('role', 'status');
                grid.appendChild(loader);
            }
            updateResultCount();
        }

        let homeObservers = {};

        function setupHomeInfiniteScroll() {
            // Grid observer
            const gridContent = document.getElementById('homeGridContent');
            const loader = document.getElementById('gridLoader');
            if (gridContent && loader) {
                if (homeObservers.grid) homeObservers.grid.disconnect();
                const tab = homeState.activeGridTab;
                const key = homeKey(tab);
                const state = homeState[key];

                homeObservers.grid = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && state.hasMore && !state.loading) {
                        state.page++;
                        fetchHomeSection(tab, state.page).then(() => {
                            renderGridCards(true);
                            setupHomeInfiniteScroll();
                        });
                    }
                }, { rootMargin: '900px 900px' }); // tải trang kế khi còn khoảng một màn hình
                homeObservers.grid.observe(loader);
            }
        }

        function switchHomeTab(tab) {
            homeState.activeGridTab = tab;
            updateFilterUI();

            document.querySelectorAll('.grid-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            const key = homeKey(tab);
            const state = homeState[key];
            // Trang 1 đã lỗi: cho thử lại khi người dùng quay lại tab (cuộn tải thêm thì không thử lại)
            if (state.fetchError && state.items.length === 0) {
                Object.assign(state, { hasMore: true, fetchError: false, deadTypes: new Set() });
            }

            if (state.items.length === 0 && !state.loading) {
                fetchHomeSection(tab, 1).then(() => {
                    renderGridCards(false);
                    setupHomeInfiniteScroll();
                });
            } else {
                renderGridCards(false);
                setupHomeInfiniteScroll();
            }
        }

        async function searchMovies() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;

            const resultsDiv = document.getElementById('searchResults');
            const overlay = document.getElementById('searchOverlay');
            const homepageContent = document.getElementById('homepageContent');
            if (homepageContent) homepageContent.style.display = 'none';
            overlay.classList.add('active');
            // sync overlay input value and focus it
            const overlayInput = document.getElementById('searchOverlayInput');
            if (overlayInput) {
                overlayInput.value = q;
                overlayInput.focus();
            }
            resultsDiv.style.display = 'grid';
            resultsDiv.innerHTML = '<div class="filter-empty" role="status">Đang tìm</div>';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (data.status === 'success' && data.data && data.data.items.length > 0) {
                    resultsDiv.innerHTML = '';
                    const cdnDomain = data.data.APP_DOMAIN_CDN_IMAGE || 'https://phimimg.com';
                    data.data.items.forEach(item => {
                        const posterPath = item.poster_url.startsWith('http') ? item.poster_url : `${cdnDomain}/${item.poster_url}`;
                        const card = buildMovieCard({
                            slug: item.slug, name: item.name, poster_url: posterPath, year: item.year,
                            quality: item.quality, lang: item.lang,
                            episode_current: item.episode_current || (item.type === 'single' ? 'Phim Lẻ' : '')
                        });
                        resultsDiv.appendChild(card);
                    });
                    setTimeout(initTabbing, 100);
                } else {
                    resultsDiv.innerHTML = '<div class="filter-empty">Không có phim phù hợp.</div>';
                }
            } catch (err) {
                console.error('[Search]', err);
                resultsDiv.innerHTML = '<div class="filter-empty">Không tìm được. Thử lại sau.</div>';
            }
        }
