<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeFlix</title>
    <!-- Thêm phông chữ tiếng Việt hiện đại Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PWA / IOS Add to Homescreen -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="M3U8 PLAYER">
    <link class="favicon" rel="apple-touch-icon" href="/static/logo.png">
    <meta name="theme-color" content="#000000">

    <!-- HLS.js cho thiết bị không Apple -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --surface-elevated: #1a1a1c;
            --accent-color: #E50914;
            --accent-hover: #b20710;
            --accent-gold: #f5c518;
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            --text-muted: #63636b;
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-strong: rgba(255, 255, 255, 0.1);
            --focus-ring: #FFD700;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 10px;
            --radius-xl: 12px;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-elevated: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-glow: 0 4px 20px rgba(229, 9, 20, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body, input, button, textarea, select {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 1. DEFAULT DESKTOP LAYOUT --- */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border-strong);
            padding-bottom: 0.5rem;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* --- TAB SYSTEM --- */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--glass-border-strong);
            padding-bottom: 0.75rem;
            width: 100%;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--glass-border);
        }

        .tab-btn.active {
            color: white;
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.3);
        }

        .tab-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- SMOOTH MANUAL INPUT --- */
        .input-card-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease;
            opacity: 0;
        }

        .input-card-wrapper.expanded {
            max-height: 400px;
            opacity: 1;
        }

        /* --- INPUT SECTION --- */
        .input-card {
            background: rgba(18, 18, 20, 0.7);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--glass-border-strong);
            backdrop-filter: blur(12px);
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-text {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            padding: 0.8rem;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: var(--transition);
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
            background: rgba(18, 18, 20, 0.95);
        }

        textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .btn-main {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-glow);
        }

        .btn-main:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(229, 9, 20, 0.35);
        }

        .btn-main:active {
            transform: translateY(0);
        }

        .btn-paste {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border-strong);
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .btn-paste:hover {
            border-color: var(--text-dim);
            color: white;
        }

        /* --- PLAYER SECTION --- */
        .player-wrapper {
            width: 100%;
            background: var(--bg-color);
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border-strong);
        }

        /* --- CUSTOM PLAYER OVERLAY --- */
        .btn-overlay-back {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: var(--transition);
        }
        .btn-overlay-back:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.2);
        }
        .player-ep-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40vw;
            margin: 0 1rem;
        }


        /* --- EPISODES DRAWER --- */
        .episodes-drawer {
            width: 100%;
            overflow: hidden;
            transition: max-height 0.35s ease;
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border-strong);
            background: rgba(18, 18, 20, 0.7);
            backdrop-filter: blur(8px);
        }
        .episodes-drawer.collapsed {
            max-height: 44px;
        }
        .episodes-drawer.expanded {
            max-height: 480px;
        }
        .episodes-drawer-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 1px solid var(--glass-border);
        }
        .episodes-drawer-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .episodes-drawer-toggle .drawer-arrow {
            transition: transform 0.3s ease;
        }
        .episodes-drawer.expanded .episodes-drawer-toggle .drawer-arrow {
            transform: rotate(180deg);
        }
        .episodes-drawer .episodes-drawer-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.75rem 1rem;
        }

        /* --- EPISODE LIST (dùng chung detail + drawer + saved) --- */
        .ep-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .ep-list-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .ep-list-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .ep-list-meta {
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .ep-list-pager {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .ep-pager-btn {
            min-width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background: rgba(18, 18, 20, 0.7);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .ep-pager-btn:hover:not(:disabled) {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }
        .ep-pager-btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .ep-pager-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .ep-pager-label {
            font-size: 0.82rem;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .ep-jump-input {
            width: 150px;
            height: 34px;
            padding: 0 0.6rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background: rgba(18, 18, 20, 0.7);
            color: var(--text-main);
            font-size: 0.8rem;
        }
        .ep-jump-input::placeholder {
            color: var(--text-dim);
        }
        .ep-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.5rem;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        .ep-list-grid::-webkit-scrollbar {
            width: 6px;
        }
        .ep-list-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
        }
        .ep-item {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            position: relative;
            background: rgba(18, 18, 20, 0.7);
            border: 1px solid var(--glass-border);
            padding: 0.6rem 0.75rem;
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
        }
        .ep-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border-color: var(--glass-border-strong);
            transform: translateY(-1px);
        }
        .ep-item:active {
            transform: scale(0.97);
        }
        .ep-item .ep-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ep-item .ep-watch-state {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        .ep-item.is-watched {
            color: #2cd054;
            border-color: rgba(44, 208, 84, 0.4);
        }
        .ep-item.is-watched:hover {
            background: rgba(44, 208, 84, 0.08);
            color: #2cd054;
        }
        .ep-item.is-watching {
            color: var(--accent-color);
            border-color: rgba(229, 9, 20, 0.45);
            animation: ep-pulse-accent 2.2s ease-in-out infinite;
        }
        .ep-item.is-watching:hover {
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-color);
        }
        .ep-item.active {
            background: rgba(229, 9, 20, 0.12);
            color: var(--accent-color);
            border-color: rgba(229, 9, 20, 0.35);
        }
        @keyframes ep-pulse-accent {
            0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.35); }
            70% { box-shadow: 0 0 0 5px rgba(229, 9, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }
        .detail-episodes {
            margin-top: 1rem;
            background: rgba(18, 18, 20, 0.7);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            backdrop-filter: blur(8px);
        }
        /* --- PLAYER TOAST --- */

        /* TV */
        .device-tv .btn-overlay-back {
            font-size: 1rem;
            padding: 0.6rem 1rem;
        }
        /* Mobile */
        .device-mobile .btn-overlay-back {
            font-size: 0.75rem;
            padding: 0.5rem 0.7rem;
        }

        .device-mobile .episodes-drawer .ep-list-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 0.4rem;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            object-fit: contain;
            background-color: var(--bg-color);
        }

        /* --- AIRPLAY REMOTE CONTROL OVERLAY --- */
        .airplay-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .airplay-remote-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 8, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            gap: 1.5rem;
            padding: 2rem;
            z-index: 20;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .airplay-remote-overlay .airplay-bg-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        .airplay-remote-overlay > *:not(.airplay-bg-poster) {
            position: relative;
            z-index: 1;
        }
        .airplay-disconnect-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 2;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-dim);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .airplay-disconnect-btn:hover {
            background: rgba(255,255,255,0.15);
            color: var(--text-main);
        }
        .airplay-header-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .airplay-header-btn:hover {
            background: rgba(255,255,255,0.12);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.2);
        }
        .airplay-remote-overlay .airplay-icon {
            font-size: 3rem;
            animation: airplayPulse 2s ease-in-out infinite;
        }
        @keyframes airplayPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .airplay-remote-overlay .airplay-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.03em;
        }
        .airplay-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 400px;
        }
        .airplay-playpause {
            width: 64px;
            height: 64px;
            min-width: 64px;
            border-radius: 50%;
            background: var(--accent-color);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--shadow-glow);
        }
        .airplay-playpause:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(229, 9, 20, 0.35);
        }
        .airplay-seek-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .airplay-seek-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .airplay-seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 6px rgba(229, 9, 20, 0.5);
        }
        .airplay-seek-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .status-msg {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
            text-align: center;
            background: rgba(18, 18, 20, 0.7);
            padding: 0.6rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }

        /* --- SEARCH TAB --- */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .search-bar {
            display: flex;
            gap: 0.5rem;
        }

        .search-input-wrap {
            flex: 1;
            position: relative;
        }

        .search-input-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            transition: var(--transition);
        }

        .search-input-wrap:focus-within .search-input-icon {
            color: var(--accent-color);
        }

        .search-bar input {
            flex: 1;
            width: 100%;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
            background: rgba(18, 18, 20, 0.95);
        }

        .search-bar input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.25rem;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }

        .poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
        }
        .poster-wrap .movie-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .poster-overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            padding: 6px;
            z-index: 1;
        }
        .poster-overlay-top .badge-chip {
            background: rgba(8,8,8,0.75);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .poster-overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(8,8,8,0.92) 0%, rgba(8,8,8,0) 100%);
            padding: 20px 8px 8px;
            z-index: 1;
        }
        .poster-overlay-bottom .overlay-ep {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-color);
            line-height: 1.3;
        }
        .poster-overlay-bottom .overlay-desc {
            font-size: 0.6rem;

        .device-tv .tab-btn {

        .device-tv .movie-title {

        }

        .device-tv .detail-hero-title {
            font-size: 2rem;
        }

        .device-tv .detail-hero-subtitle {

        }

        .device-tv .detail-overview {
            font-size: 1rem;
        }

        .device-tv .detail-action-side {
            height: 56px;
            font-size: 1rem;
        }

        .device-tv .detail-action-play {
            height: 56px;
            font-size: 1.1rem;
        }

        /* Hộp viền tập trung (focus ring) cực kỳ nổi bật khi duyệt remote trên TV/Projector */
        .device-tv input:focus, 
        .device-tv textarea:focus, 
        .device-tv button:focus, 
        .device-tv .tab-btn:focus, 
        .device-tv .movie-card:focus, 
        .device-tv .ep-item:focus {

        }

        .device-tv .movie-card:hover {
            transform: none; /* Bỏ hover máy chiếu tránh lag */
        }


        /* ==========================================================================
           📱 3. IPHONE & IPAD & MOBILE TOUCH OPTIMIZED LAYOUT (Compact & Touch friendly)
           ========================================================================== */
        .device-mobile .container {
            padding: 1rem;
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));

        }

        .device-mobile .detail-hero-subtitle {

        }

        .device-mobile .detail-hero-content {

        .device-mobile .detail-chips {

        .device-mobile .search-overlay {

        /* --- SMARTPAGE: HERO SECTION --- */
        .hero-scroll-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .hero-scroll-grid {
            display: flex;

        }

        .hero-scroll-grid::-webkit-scrollbar-thumb {

        }

        .hero-card {
            flex: 0 0 200px;

            transition: var(--transition);

            display: flex;

        .hero-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229, 9, 20, 0.4);

        }

        .hero-card .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--surface-elevated);
        }

        .hero-card .movie-info {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .hero-card .movie-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-card .movie-meta {

            gap: 0.5rem;

            background: rgba(229, 9, 20, 0.12);

            border-radius: 3px;

            font-weight: 700;
        }

        .skeleton-card {
            flex: 0 0 200px;
            border-radius: 6px;
            background: #1a1a1a;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .skeleton-card .skeleton-img {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--surface-elevated);
        }

        .skeleton-card .skeleton-text {

            margin: 0.5rem;
            background: var(--surface-elevated);
            border-radius: 3px;
        }

        .skeleton-card .skeleton-text-short {
            width: 60%;
            height: 0.6rem;
            margin: 0 0.5rem 0.5rem;
            background: var(--surface-elevated);
            border-radius: 3px;
        }

        /* TV mode */
        .device-tv .hero-card {
            flex: 0 0 250px;
        }

        .device-tv .hero-card .movie-title {
            font-size: 1rem;
        }

        .device-tv .skeleton-card {
            flex: 0 0 250px;
        }

        /* Mobile */
        .device-mobile .hero-card {
            flex: 0 0 160px;
        }

        .device-mobile .skeleton-card {
            flex: 0 0 160px;
        }

        /* --- SMARTPAGE: GRID TABS SECTION --- */
        .grid-tabs-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .grid-tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .grid-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .grid-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--glass-border);

        .grid-tab-btn.active {
            color: white;
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.3);
        }

        .grid-tab-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.25rem;
        }

        .grid-load-more {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 1rem;
        }

        /* --- FILTER BAR & DROPDOWN --- */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }
        .filter-dropdown {
            position: relative;
        }
        .filter-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 0.9rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.06);
        }
        .filter-btn.active {
            color: var(--accent-color);
            border-color: rgba(229,9,20,0.4);
            background: rgba(229,9,20,0.1);
        }
        .filter-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 200px;
            max-height: 300px;
            overflow-y: auto;
            background: #111113;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 0.4rem;
            z-index: 50;
            flex-direction: column;
            gap: 2px;

            display: flex;
        }
        .filter-option {

            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-option:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
        }
        .filter-option.active {
            color: var(--accent-color);
            background: rgba(229,9,20,0.1);
        }
        .filter-clear-btn {
            background: transparent;
            border: 1px solid rgba(229,9,20,0.4);
            color: var(--accent-color);
            font-size: 0.75rem;
            padding: 0.4rem 0.7rem;

            transition: var(--transition);

        .device-mobile .filter-bar {
            margin-left: 0;

            flex-wrap: wrap;
        }
        .device-tv .filter-btn,
        .device-tv .filter-option,

            padding-bottom: 0.6rem;

        .device-tv .filter-btn:focus-visible,

        .device-tv .grid-tab-content {

            grid-template-columns: repeat(2, 1fr);

        }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(8, 8, 8, 0.85);

            -webkit-backdrop-filter: blur(24px);
            overflow-y: auto;
            padding: 1.5rem;
        }

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-overlay-header {
            width: 100%;
            max-width: 1000px;

            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;

            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 1.5rem;

            align-items: center;
            transition: var(--transition);

            border-color: var(--glass-border-strong);

        /* Responsive styling for Mobile */

        .sticky-header {

        /* 21:9 & Ultra-wide screen optimization for Player */

    <script>
        const inputArea = document.getElementById('m3u8InputRaw');
        const btnPlay = document.getElementById('btnMainPlay');
        const btnPaste = document.getElementById('btnQuickActionPaste');
        const video = document.getElementById('videoPlayer');

        
        // --- Double-click zoom ---
        let zoomMode = false;
        
        function togglePlayerZoom() {
            zoomMode = !zoomMode;
            video.style.objectFit = zoomMode ? 'cover' : 'contain';
        }
        
        video.addEventListener('dblclick', togglePlayerZoom);
        const globalPlayer = document.getElementById('globalPlayerContainer');
        const appHeader = document.getElementById('appHeader');
        const appTabsNav = document.getElementById('appTabsNav');
        const stickyHeader = document.getElementById('stickyHeader');
        let hlsObj = null;

        // --- Native Fullscreen flag (chỉ gọi 1 lần mỗi session phát) ---
        let hasEnteredFullscreen = false;

        // --- Player header controls ---
        const playerOverlay = {
            setTitle(title) {
                const el = document.getElementById('playerEpTitle');
                if (el) el.textContent = title || '';
            }
        };

// --- Episodes Drawer ---
let episodesDrawerExpanded = true;

function buildEpisodesDrawer() {
    const existing = document.getElementById('episodesDrawerEl');
    if (existing) existing.remove();
    
    const drawer = document.createElement('div');
    drawer.id = 'episodesDrawerEl';
    drawer.className = 'episodes-drawer expanded';
    
    const toggle = document.createElement('button');
    toggle.className = 'episodes-drawer-toggle';
    toggle.innerHTML = `<span>📋 Danh sách tập (<span id="epCount">0</span>)</span><span class="drawer-arrow">▾</span>`;
    toggle.onclick = toggleEpisodesDrawer;
    
    const grid = document.createElement('div');
    grid.className = 'episodes-drawer-grid';
    grid.id = 'drawerEpGrid';
    
    drawer.appendChild(toggle);
    drawer.appendChild(grid);
    
    return drawer;
}

function toggleEpisodesDrawer() {
    const drawer = document.getElementById('episodesDrawerEl');
    if (!drawer) return;
    episodesDrawerExpanded = !episodesDrawerExpanded;
    drawer.className = 'episodes-drawer ' + (episodesDrawerExpanded ? 'expanded' : 'collapsed');
}

        function buildEpisodesGridInDrawer(episodesArray, playIdx) {
            const grid = document.getElementById('drawerEpGrid');
            if (!grid) return;

            const countEl = document.getElementById('epCount');
            if (countEl) countEl.textContent = episodesArray.length;

            const safePlayIdx = Math.max(0, playIdx || 0);
            grid._epChunk = Math.floor(safePlayIdx / EP_CHUNK);

            let watchStates = {};
            if (currentMovie && currentMovie.slug) {
                const saved = savedMoviesList.find(item => item.slug === currentMovie.slug);
                if (saved && saved.episode_states) watchStates = saved.episode_states;
            }

            renderEpisodeList(grid, {
                episodes: episodesArray,
                movieSlug: currentMovie ? currentMovie.slug : null,
                watchStates,
                showTitle: false,
                onPlay: (ep, i) => play(ep.link_m3u8, ep.name, i)
            });

            const localIdx = safePlayIdx - grid._epChunk * EP_CHUNK;
            const activeBtn = grid.querySelectorAll('.ep-item')[localIdx];
            if (activeBtn) activeBtn.classList.add('active');
        }

        function syncDrawerToPlaying(url) {
            const grid = document.getElementById('drawerEpGrid');
            if (!grid) return;
            const epIdx = playbackEpisodes.findIndex(ep => ep.link_m3u8 === url);
            if (epIdx === -1) return;
            const targetChunk = Math.floor(epIdx / EP_CHUNK);
            if (grid._epChunk !== targetChunk) {
                grid._epChunk = targetChunk;
                buildEpisodesGridInDrawer(playbackEpisodes, epIdx);
            } else {
                grid.querySelectorAll('.ep-item').forEach(b => b.classList.toggle('active', b.__epUrl === url));
            }
        }

        // --- Unified Episode List (dùng chung detail + drawer + saved) ---
        const EP_CHUNK = 100;

        function el(tag, className, text) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (text !== undefined) n.textContent = text;
            return n;
        }

        function renderEpisodeList(containerEl, opts) {
            if (!containerEl) return;
            const { episodes, movieSlug, watchStates, onPlay, autoFocusWatching, showTitle, showMeta } = opts;
            if (!episodes || episodes.length === 0) {
                containerEl.innerHTML = '';
                return;
            }
            const ws = watchStates || {};
            const total = episodes.length;
            const chunkCount = Math.max(1, Math.ceil(total / EP_CHUNK));

            let chunk = containerEl._epChunk;
            if (typeof chunk !== 'number' || chunk < 0 || chunk >= chunkCount) {
                chunk = 0;
                if (autoFocusWatching !== false) {
                    const wIdx = episodes.findIndex(ep => ws[ep.link_m3u8] === 'watching');
                    if (wIdx > -1) chunk = Math.floor(wIdx / EP_CHUNK);
                }
            }
            containerEl._epChunk = chunk;

            containerEl.innerHTML = '';

            const list = el('div', 'ep-list');

            const start = chunk * EP_CHUNK;
            const slice = episodes.slice(start, start + EP_CHUNK);

            const header = el('div', 'ep-list-header');
            if (showTitle !== false) {
                header.appendChild(el('span', 'ep-list-title', `Danh sách tập (${total})`));
            }
            if (showMeta !== false) {
                const metaBits = [];
                const watchedCount = Object.values(ws).filter(s => s === 'watched').length;
                if (watchedCount > 0) metaBits.push(`Đã xem ${watchedCount}`);
                let dlCount = 0;
                if (movieSlug && downloadStatuses[movieSlug]) {
                    dlCount = Object.values(downloadStatuses[movieSlug]).filter(s => s === 'completed').length;
                }
                if (dlCount > 0) metaBits.push(`Đã tải ${dlCount}`);
                if (metaBits.length) header.appendChild(el('span', 'ep-list-meta', metaBits.join(' · ')));
            }
            if (header.childElementCount > 0) list.appendChild(header);

            if (chunkCount > 1) {
                const pager = el('div', 'ep-list-pager');
                const prev = el('button', 'ep-pager-btn', '‹');
                prev.disabled = chunk === 0;
                prev.title = 'Trang trước';
                prev.onclick = () => {
                    containerEl._epChunk = chunk - 1;
                    renderEpisodeList(containerEl, opts);
                };
                pager.appendChild(prev);
                pager.appendChild(el('span', 'ep-pager-label', `Tập ${start + 1}–${Math.min(start + EP_CHUNK, total)} / ${total}`));
                const next = el('button', 'ep-pager-btn', '›');
                next.disabled = chunk >= chunkCount - 1;
                next.title = 'Trang sau';
                next.onclick = () => {
                    containerEl._epChunk = chunk + 1;
                    renderEpisodeList(containerEl, opts);
                };
                pager.appendChild(next);
                const jump = el('input', 'ep-jump-input');
                jump.type = 'number';
                jump.min = 1;
                jump.max = total;
                jump.placeholder = 'Nhảy tới tập';
                jump.onkeydown = (e) => {
                    if (e.key !== 'Enter') return;
                    const n = parseInt(jump.value, 10);
                    if (!isNaN(n)) {
                        const idx = Math.min(total - 1, Math.max(0, n - 1));
                        containerEl._epChunk = Math.floor(idx / EP_CHUNK);
                        renderEpisodeList(containerEl, opts);
                    }
                };
                pager.appendChild(jump);
                list.appendChild(pager);
            }

            const grid = el('div', 'ep-list-grid');
            slice.forEach((ep, i) => {
                const realIdx = start + i;
                const btn = el('button', 'ep-item');
                btn.__epUrl = ep.link_m3u8;

                const st = ws[ep.link_m3u8];
                if (st === 'watching') {
                    btn.classList.add('is-watching');
                    btn.title = 'Đang xem — tiếp tục';
                } else if (st === 'watched') {
                    btn.classList.add('is-watched');
                    btn.title = 'Đã xem';
                }

                if (st === 'watching' || st === 'watched') {
                    const wsIcon = el('span', 'ep-watch-state');
                    wsIcon.innerHTML = st === 'watched'
                        ? '<svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'
                        : '<svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    btn.appendChild(wsIcon);
                }

                btn.appendChild(el('span', 'ep-name', ep.name));

                if (movieSlug) {
                    const indicator = el('span', 'ep-dl-indicator not_started');
                    indicator.setAttribute('data-movie-slug', movieSlug);
                    indicator.setAttribute('data-ep-name', ep.name);
                    indicator.setAttribute('data-ep-url', ep.link_m3u8);
                    indicator.onclick = (e) => requestDownloadEpisode(e, movieSlug, ep.name, ep.link_m3u8);
                    btn.appendChild(indicator);
                }

                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (onPlay) onPlay(ep, realIdx);
                };
                grid.appendChild(btn);
            });
            list.appendChild(grid);
            containerEl.appendChild(list);
        }

        video.addEventListener('play', () => {
            if (!hasEnteredFullscreen && video.webkitSupportsFullscreen) {
                video.webkitEnterFullscreen();
                hasEnteredFullscreen = true;
            }
        });

// Desktop auto-fullscreen on first play
video.addEventListener('play', () => {
    if (!hasEnteredFullscreen) {
        const el = document.documentElement;
        if (el.requestFullscreen && !document.fullscreenElement) {
            el.requestFullscreen().catch(() => {});
        }
        hasEnteredFullscreen = true;
    }
});

        // --- AirPlay Remote Control Mode ---
        let isAirplayActive = false;
        let airplaySeekInterval = null;
        let isAirplayAvailable = false;

        // Phát hiện AirPlay khả dụng
        if (typeof video.webkitSupportsAirPlay === 'function') {
            video.webkitShowPlaybackTargetPicker = video.webkitShowPlaybackTargetPicker || function(){};
        }
        video.addEventListener('webkitplaybacktargetavailabilitychanged', (e) => {
            isAirplayAvailable = e.availability === 'available';
            toggleAirplayBtn();
        });

        video.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', () => {
            const isWireless = video.webkitCurrentPlaybackTargetIsWireless;
            toggleRemoteMode(isWireless);

        function disconnectAirPlay() {
            // Ngắt AirPlay bằng cách clear source — force disconnect
            video.pause();

            video.removeAttribute('src');
            video.load();
            toggleRemoteMode(false);
            isAirplayActive = false;
            // Khôi phục lại video về local sau 200ms
            setTimeout(() => {
                if (wasSrc && !isAirplayActive) {
                    video.src = wasSrc;
                    video.play().catch(() => {});

        function toggleRemoteMode(isWireless) {
            const overlay = document.getElementById('airplayOverlay');
            isAirplayActive = isWireless;

            if (isWireless) {
                // Giữ video alive (không display:none) — set opacity 0 để AirPlay ổn định
                video.classList.add('airplay-hidden');
                overlay.style.display = 'flex';
                // Gán poster nếu có
                const posterImg = document.getElementById('airplayBgPoster');
                const currentPoster = video.getAttribute('data-poster');
                if (currentPoster && posterImg) posterImg.src = currentPoster;
                startAirplaySeekSync();
                updateAirplayPlayPauseIcon();
                toggleAirplayBtn();
            } else {
                video.classList.remove('airplay-hidden');
                overlay.style.display = 'none';
                stopAirplaySeekSync();
                toggleAirplayBtn();
                // Resume local playback nếu video đang phát mà bị ngắt AirPlay
                if (!video.paused) {
                    video.play().catch(() => {});
                }
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function startAirplaySeekSync() {
            stopAirplaySeekSync();
            const seekBar = document.getElementById('airplaySeekBar');
            const timeCurrent = document.getElementById('airplayTimeCurrent');
            const timeDuration = document.getElementById('airplayTimeDuration');

            airplaySeekInterval = setInterval(() => {
                if (!video.duration) return;
                seekBar.max = video.duration;
                seekBar.value = video.currentTime;
                timeCurrent.textContent = formatTime(video.currentTime);
                timeDuration.textContent = formatTime(video.duration);
                updateAirplayPlayPauseIcon();
            }, 500);

            seekBar.oninput = () => {
                video.currentTime = parseFloat(seekBar.value);
            };
        }

        function stopAirplaySeekSync() {
            if (airplaySeekInterval) {
                clearInterval(airplaySeekInterval);
                airplaySeekInterval = null;
            }
        }

        async function fetchHomeSection(section, page) {
            const key = section === 'latest' ? 'latest' : homeKey(section);
            const state = homeState[key];
            if (state.loading || !state.hasMore) return;

            state.loading = true;
            state.page = page || state.page;

            let endpoint;
            let query = `page=${state.page}`;
            if (section === 'latest') {
                endpoint = '/api/home/latest';
            } else {
                endpoint = section === 'phim-le' ? '/api/home/phim-le' : section === 'phim-bo' ? '/api/home/phim-bo' : section === 'tv-shows' ? '/api/home/tv-shows' : '/api/home/phim-chieu-rap';
                const f = state.filters;
                if (f.category) query += `&category=${encodeURIComponent(f.category)}`;
                if (f.country) query += `&country=${encodeURIComponent(f.country)}`;
                if (f.year) query += `&year=${encodeURIComponent(f.year)}`;
            }

            const mySeq = ++state.fetchSeq;

            try {
                const res = await fetch(`${endpoint}?${query}`);
                const data = await res.json();
                if (mySeq !== state.fetchSeq) return;

                if (!res.ok || data.error) {
                    state.fetchError = true;
                    return;
                }
                state.fetchError = false;

                const items = data.items || [];
                if (items.length === 0 || (data.pagination && data.pagination.currentPage >= data.pagination.totalPages)) {
                    state.hasMore = false;
                }

                if (state.page === 1) {
                    state.items = items;
                } else {
                    state.items = state.items.concat(items);
                }
            } catch (e) {
                state.fetchError = true;
                console.error(`Error fetching ${section}:`, e);
            } finally {
                if (mySeq === state.fetchSeq) state.loading = false;
            }
        }

        let homeObservers = {};

        function setupHomeInfiniteScroll() {
            // Hero observer
            const heroGrid = document.getElementById('heroGrid');
            if (heroGrid && homeState.latest.hasMore) {
                if (homeObservers.hero) homeObservers.hero.disconnect();
                homeObservers.hero = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && homeState.latest.hasMore && !homeState.latest.loading) {
                        homeState.latest.page++;
                        fetchHomeSection('latest', homeState.latest.page).then(() => {
                            renderHeroCards();
                            setupHomeInfiniteScroll();
                        });
                    }
                }, { rootMargin: '300px' });
                const lastCard = heroGrid.lastElementChild;
                if (lastCard) homeObservers.hero.observe(lastCard);
            }

            // Grid observer
            const gridContent = document.getElementById('homeGridContent');
            const loader = document.getElementById('gridLoader');
            if (gridContent && loader) {
                if (homeObservers.grid) homeObservers.grid.disconnect();
                const tab = homeState.activeGridTab;
                const key = homeKey(tab);
                const state = homeState[key];

                homeObservers.grid = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && state.hasMore && !state.loading) {
                        state.page++;
                        fetchHomeSection(tab, state.page).then(() => {
                            renderGridCards(true);
                            setupHomeInfiniteScroll();
                        });
                    }
                }, { rootMargin: '300px' });
                homeObservers.grid.observe(loader);
            }
        }

                fetchHomeSection(tab, 1).then(() => {
                    renderGridCards(false);
                    setupHomeInfiniteScroll();
                });
            } else {
                renderGridCards(false);
                setupHomeInfiniteScroll();
            }
        }

                const movieSlug = indicator.getAttribute('data-movie-slug');
                const epName = indicator.getAttribute('data-ep-name');
                if (!movieSlug || !epName) return;
                
                let status = "not_started";
                if (downloadStatuses[movieSlug] && downloadStatuses[movieSlug][epName]) {
                    status = downloadStatuses[movieSlug][epName];
                }
                
                indicator.className = `ep-dl-indicator ${status}`;
                
                if (status === 'completed') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    `;
                    indicator.title = "Đã tải xuống (Xem offline)";
                } else if (status === 'downloading') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 14 14">
                            <circle cx="7" cy="7" r="5" stroke-opacity="0.25"/>
                            <path d="M7 2a5 5 0 0 1 5 5" stroke-linecap="round"/>
                        </svg>
                    `;
                    indicator.title = "Đang tải...";
                } else if (status === 'pending') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 14 14">
                            <circle cx="7" cy="7" r="5"/>
                            <path stroke-linecap="round" d="M7 4v3l2 1"/>
                        </svg>
                    `;
                    indicator.title = "Đang chờ tải...";
                } else if (status === 'failed') {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    `;
                    indicator.title = "Tải thất bại. Nhấp để tải lại.";
                } else {
                    indicator.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>

                }

        async function requestDownloadEpisode(event, movieSlug, epName, epUrl) {
            if (event) event.stopPropagation();
            
            if (downloadStatuses[movieSlug] && (downloadStatuses[movieSlug][epName] === 'completed' || downloadStatuses[movieSlug][epName] === 'downloading' || downloadStatuses[movieSlug][epName] === 'pending')) {
                return;
            }
            
            if (!downloadStatuses[movieSlug]) downloadStatuses[movieSlug] = {};
            downloadStatuses[movieSlug][epName] = 'pending';
            updateDownloadIndicatorsUI();
            
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_slug: movieSlug, episode_name: epName, episode_url: epUrl })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    fetchDownloadStatuses();
                } else {
                    downloadStatuses[movieSlug][epName] = 'failed';
                    updateDownloadIndicatorsUI();
                }
            } catch (e) {
                console.error("Lỗi khi tải tập phim:", e);
                downloadStatuses[movieSlug][epName] = 'failed';
                updateDownloadIndicatorsUI();
            }
        }

        // --- 1. DYNAMIC DEVICE DETECTION ---
        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const body = document.body;
            
            const isTV = /tv|smarttv|googletv|appletv|hbbtv|netcast|webos|tizen|rokutv|ctv|box|playstation|xbox|nintendo|large-screen/i.test(ua)
                         || (window.screen.width >= 1920 && !('ontouchstart' in window));
            
            const isMobile = /iphone|ipad|ipod|android/i.test(ua)
                             || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /macintosh/i.test(ua));
                             
            if (isTV) {
                body.className = 'device-tv';
                console.log("HomeFlix Mode: Smart TV / Projector (D-Pad support enabled)");
            } else if (isMobile) {
                body.className = 'device-mobile';
                console.log("HomeFlix Mode: iOS / Android Mobile (Touch optimized)");
            } else {
                body.className = 'device-desktop';
                console.log("HomeFlix Mode: Desktop (Hover & mouse optimized)");
            }
        }

        function execute(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const episodes = [];
            const regex = /(https?:\/\/[^\s|]+\.m3u8[^\s|]*)/i;

            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const url = match[0];
                    let title = line.includes('|') ? line.split('|')[0].trim() : "";
                    if (!title) {
                        const clean = line.replace(url, '').replace('|', '').trim();
                        title = clean || `Tập ${String(episodes.length + 1).padStart(2, '0')}`;
                    }
                    episodes.push({ name: title, link_m3u8: url });
                }
            });

            if (episodes.length > 0) {
                playEpisodesListDirect(episodes, episodes[0].link_m3u8);
            } else {
                alert('KHÔNG TÌM THẤY VIDEO');
            }
        }

        // Tải tập phim với tuỳ chọn vị trí phát bằng mảng tập phim đã chuẩn hóa
        function playEpisodesListDirect(episodesArray, targetUrlOrIdx) {
            if (!episodesArray || episodesArray.length === 0) {
                alert('KHÔNG TÌM THẤY VIDEO');
                return;
            }
            
            playbackEpisodes = episodesArray;
            
            if (stickyHeader) stickyHeader.style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');

            document.body.classList.add('player-active');
            globalPlayer.style.display = 'flex';
            
            // Add episodes drawer after player-wrapper
            const drawer = buildEpisodesDrawer();
            globalPlayer.appendChild(drawer);
            
            let playIdx = 0;
            episodesArray.forEach((ep, i) => {
                if (typeof targetUrlOrIdx === 'number') {
                    if (i === targetUrlOrIdx) playIdx = i;
                } else if (targetUrlOrIdx) {
                    if (ep.link_m3u8 === targetUrlOrIdx) playIdx = i;
                }
            });
            
            buildEpisodesGridInDrawer(episodesArray, playIdx);
            const startEp = episodesArray[playIdx];
            play(startEp.link_m3u8, startEp.name, playIdx);
            updateDownloadIndicatorsUI();
        }

        async function play(url, title, idx) {
            console.log("[Play] Bắt đầu phát tập:", title, "URL:", url, "currentMovie:", currentMovie);
            currentPlaybackIndex = idx;
            syncDrawerToPlaying(url);

            // Gửi báo cáo tiến trình xem phim về Server (nếu phim đã được lưu)
            if (currentMovie && currentMovie.slug) {
                console.log("[Play] Gửi tiến trình xem cho:", currentMovie.slug);
                fetch('/api/saved/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slug: currentMovie.slug,
                        last_watched_episode: title,
                        last_watched_url: url
                    })
                }).then(res => res.json()).then(data => {
                    console.log("[Play] Lưu tiến trình xem thành công:", data);
                    if (data.status === 'success') {
                        const sIdx = savedMoviesList.findIndex(item => item.slug === currentMovie.slug);
                        if (sIdx > -1) {
                            savedMoviesList[sIdx].last_watched_episode = title;
                            savedMoviesList[sIdx].last_watched_url = url;
                            // Cập nhật state trực tiếp để render màu sắc động tức thời
                            if (!savedMoviesList[sIdx].episode_states) {
                                savedMoviesList[sIdx].episode_states = {};
                            }
                            for (let key in savedMoviesList[sIdx].episode_states) {
                                if (savedMoviesList[sIdx].episode_states[key] === "watching") {
                                    savedMoviesList[sIdx].episode_states[key] = "watched";
                                }
                            }
                            savedMoviesList[sIdx].episode_states[url] = "watching";
                            refreshDetailEpisodeList();
                        }
                    }
                }).catch(err => console.error("Error saving progress:", err));
            }

            if (hlsObj) {
                console.log("[Play] Hủy hlsObj cũ");
                hlsObj.destroy();
                hlsObj = null;
            }

            // Kiểm tra xem tập phim này đã được tải về đĩa MP4 chưa
            let useMp4 = false;
            let mp4Url = "";
            if (currentMovie && currentMovie.slug) {
                try {
                    const checkUrl = `/api/download/status/${currentMovie.slug}/${encodeURIComponent(title)}`;
                    console.log("[Play] Kiểm tra trạng thái tải MP4:", checkUrl);
                    const statusRes = await fetch(checkUrl);
                    const statusData = await statusRes.json();
                    console.log("[Play] Kết quả trạng thái tải MP4:", statusData);
                    if (statusData.status === "completed") {
                        useMp4 = true;
                        mp4Url = `/media/${currentMovie.slug}/${encodeURIComponent(title)}.mp4`;
                    }
                } catch (e) {
                    console.error("Lỗi kiểm tra trạng thái tải MP4:", e);
                }
            }

            video.onerror = () => {
                const errorMap = {
                    1: "Người dùng đã hủy tải video.",
                    2: "Lỗi đường truyền (Network Error).",
                    3: "Lỗi giải mã (Decoding Error).",
                    4: "Không tìm thấy phim hoặc link không hợp lệ."
                };
                const msg = errorMap[video.error ? video.error.code : 4] || "Lỗi không xác định.";
                console.error("[Play] Video Error Event:", video.error, "Msg:", msg);
                alert(`[Native Player Error]: ${msg}\nTên tập: ${title}`);
            };

            console.log("[Play] useMp4 =", useMp4, "mp4Url =", mp4Url);

            // Set poster for AirPlay bg
            if (currentMovie && currentMovie.poster_url) {
                video.setAttribute('data-poster', currentMovie.poster_url);
            } else {
                video.removeAttribute('data-poster');
            }

            // Update overlay title
            playerOverlay.setTitle(title);

            if (useMp4) {
                video.src = mp4Url;
                console.log("[Play] Phát MP4 qua src");
                video.play().catch(err => console.error("[Play] Lỗi video.play() MP4:", err));
            } else {
                const proxy = `/proxy/m3u8?url=${encodeURIComponent(url)}`;
                console.log("[Play] Phát HLS qua Proxy:", proxy);

                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    console.log("[Play] Trình duyệt hỗ trợ mpegurl gốc (Native HLS)");
                    video.src = proxy;
                    video.play().catch(err => console.error("[Play] Lỗi video.play() Native HLS:", err));
                } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    console.log("[Play] Sử dụng Hls.js");
                    const isTVMode = document.body.classList.contains('device-tv');
                    hlsObj = new Hls({
                        maxBufferLength: isTVMode ? 20 : 30,
                        maxMaxBufferLength: isTVMode ? 120 : 600,
                        manifestLoadingMaxRetry: 5,
                        lowLatencyMode: !isTVMode
                    });
                    hlsObj.loadSource(proxy);
                    hlsObj.attachMedia(video);
                    hlsObj.on(Hls.Events.MANIFEST_PARSED, () => {
                        console.log("[Play] MANIFEST_PARSED, gọi video.play()");
                        video.play().catch(err => console.error("[Play] Lỗi video.play() Hls.js:", err));
                    });
                    
                    hlsObj.on(Hls.Events.ERROR, (event, data) => {
                        console.warn("[Play] Hls.js error event:", data);
                        if (data.fatal) {
                            let errorMsg = "";
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    errorMsg = "Lỗi kết nối mạng (Network Error)";
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    errorMsg = "Lỗi định dạng phim (Media Error)";
                                    break;
                                default:
                                    errorMsg = "Lỗi hệ thống khởi tạo (System Error)";
                                    break;
                            }
                            alert(`[HLS Error]: ${errorMsg}\nChi tiết: ${data.details}\nTên tập: ${title}`);
                            hlsObj.destroy();
                        }
                    });
                } else {
                    console.error("[Play] Trình duyệt không hỗ trợ phát HLS (không có Hls.js và không có Native HLS)");
                    alert('LỖI: TRÌNH DUYỆT KHÔNG HỖ TRỢ HLS');
                }
            }
        }

        function refreshDetailEpisodeList() {
            const listEl = document.getElementById('detailEpisodeList');
            if (!listEl || !currentDetailEpisodes || currentDetailEpisodes.length === 0) return;
            let watchStates = {};
            let movie = currentMovie;
            if (movie && movie.slug) {
                const saved = savedMoviesList.find(item => item.slug === movie.slug);
                if (saved && saved.episode_states) watchStates = saved.episode_states;
            }
            renderEpisodeList(listEl, {
                episodes: currentDetailEpisodes,
                movieSlug: movie ? movie.slug : null,
                watchStates,
                onPlay: (ep) => {
                    if (movie) currentMovie = { slug: movie.slug, name: movie.name, poster_url: movie.poster_url };
                    playEpisodesListDirect(currentDetailEpisodes, ep.link_m3u8);
                }
            });
        }

        function playSelectedMovieDirect(name, slug) {
            const savedMovie = savedMoviesList.find(item => item.slug === slug);
            currentMovie = { slug, name, poster_url: savedMovie ? savedMovie.poster_url : null };
            const targetUrl = savedMovie ? savedMovie.last_watched_url : null;
            playEpisodesListDirect(currentDetailEpisodes, targetUrl);
        }


        // --- SERVER SAVED MOVIES FUNCTIONS ---
        async function fetchSavedMovies() {
            try {
                const res = await fetch('/api/saved');
                savedMoviesList = await res.json();
            } catch(e) {
                console.error("Lỗi lấy danh sách tủ phim:", e);
            }
        }

        function checkIsSaved(slug) {
            return savedMoviesList.some(item => item.slug === slug);
        }

        async function toggleSaveMovie(slug, name, poster_url, year, episode_current, total_episodes) {
            const btn = document.getElementById('btnSaveDetail');
            const txt = document.getElementById('saveBtnText');
            const isSaved = checkIsSaved(slug);
            
            if (isSaved) {
                try {
                    const res = await fetch(`/api/saved/${slug}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.status === 'success') {
                        savedMoviesList = savedMoviesList.filter(item => item.slug !== slug);
                        if (btn) {
                            btn.className = "detail-action-side";
                            txt.textContent = "Lưu phim";
                        }
                    }
                } catch(e) { alert("Không thể xóa phim: " + e.message); }
            } else {
                try {
                    const res = await fetch('/api/saved', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            slug, 
                            name, 
                            poster_url, 
                            year, 
                            episode_current, 
                            total_episodes,
                            episodes: currentDetailEpisodes
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        savedMoviesList.push(data.movie);
                        if (btn) {
                            btn.className = "detail-action-side";
                            txt.textContent = "Đã lưu";
                        }
                    }
                } catch(e) { alert("Không thể lưu phim: " + e.message); }
            }
        }

        async function deleteSavedMovie(slug) {
            try {
                const res = await fetch(`/api/saved/${slug}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    savedMoviesList = savedMoviesList.filter(item => item.slug !== slug);
                    renderSavedMovies();
                }
            } catch(e) { alert("Lỗi xóa phim: " + e.message); }
        }

        async function syncEpisodesForMovie(slug) {
            try {
                const res = await fetch(`/api/movie/${slug}`);
                const data = await res.json();
                if (data.status === 'success' && data.movie) {
                    const saved = savedMoviesList.find(item => item.slug === slug);
                    if (saved) {
                        saved.episodes = data.episodes || [];
                        await fetch('/api/saved', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(saved)
                        });
                        renderSavedMovies();
                    }
                }
            } catch(e) {
                alert("Lỗi đồng bộ tập phim: " + e.message);
            }
        }
